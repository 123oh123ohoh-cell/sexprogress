    });

    panel.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });

    // ── Invite link ───────────────────────────────────────────────────────────
    if (youOwn) {
      let inviteCode = info.inviteCode || null;

      function refreshInviteUI() {
        const linkEl = panel.querySelector("#rsInviteLink");
        const copyBtn = panel.querySelector("#rsInviteCopyBtn");
        if (!linkEl) return;
        if (inviteCode) {
          const url = `${location.origin}/chat.html?invite=${inviteCode}`;

          linkEl.style.color = "var(--accent, #6366f1)";

          linkEl.textContent = "Click Generate to create a link";
          linkEl.style.fontStyle = "italic";
          linkEl.style.color = "var(--muted)";

        }
      }

      refreshInviteUI();

      panel.querySelector("#rsInviteGenBtn")?.addEventListener("click", async () => {
        const res = await apiFetch(`/api/chat/rooms/${encodeURIComponent(roomId)}/invite`, { method: "POST" });
        if (res && res.code) { inviteCode = res.code; refreshInviteUI(); }
      });

      panel.querySelector("#rsInviteCopyBtn")?.addEventListener("click", () => {
        if (!inviteCode) return;
        const url = `${location.origin}/chat.html?invite=${inviteCode}`;

    // ── Members list ─────────────────────────────────────────────────────────
    (async () => {
      const membersEl = panel.querySelector("#rsMembersList");
      if (!membersEl) return;
      const data = await apiFetch(`/api/chat/rooms/${encodeURIComponent(roomId)}/members`);
      if (!data) { membersEl.innerHTML = `<span style="color:var(--muted)">Could not load members.</span>`; return; }
      const { members, communityMods = [], owner } = data;
      const canPromote = youOwn || (currentUser?.adminRole && ROLE_WEIGHTS_CLIENT[currentUser.adminRole] >= ROLE_WEIGHTS_CLIENT["moderator"]);

      membersEl.innerHTML = members.map(u => {
        const isOwner = u === owner;
        const isMod = communityMods.includes(u);
        const badge = isOwner ? `<span class="chat-owner-badge">👑 Owner</span>` : isMod ? `<span class="chat-mod-badge">🛡 Mod</span>` : "";
        const modBtn = canPromote && !isOwner && u !== currentUser?.username
          ? (isMod
            ? `<button type="button" class="rs-demote-btn" data-username="${escapeHTML(u)}">Remove mod</button>`
            : `<button type="button" class="rs-promote-btn" data-username="${escapeHTML(u)}">Make mod</button>`)
          : "";
        return `<div class="rs-member-row">
          <span class="rs-member-name">@${escapeHTML(u)}${badge}</span>

      }).join("") || `<span style="color:var(--muted)">No members yet.</span>`;

      membersEl.addEventListener("click", async e => {
        const promoteBtn = e.target.closest(".rs-promote-btn");
        const demoteBtn  = e.target.closest(".rs-demote-btn");
        if (promoteBtn) {
          const un = promoteBtn.dataset.username;
          const res = await apiFetch(`/api/chat/rooms/${encodeURIComponent(roomId)}/mods/${encodeURIComponent(un)}`, { method: "PUT" });
          if (res?.ok) { showToast(`@${un} is now a mod.`); promoteBtn.closest(".rs-member-row").querySelector("span").innerHTML = `@${escapeHTML(un)}<span class="chat-mod-badge">🛡 Mod</span>`; promoteBtn.outerHTML = `<button type="button" class="rs-demote-btn" data-username="${escapeHTML(un)}">Remove mod</button>`; }
        }
        if (demoteBtn) {
          const un = demoteBtn.dataset.username;
          const res = await apiFetch(`/api/chat/rooms/${encodeURIComponent(roomId)}/mods/${encodeURIComponent(un)}`, { method: "DELETE" });
          if (res?.ok) { showToast(`@${un} is no longer a mod.`); demoteBtn.closest(".rs-member-row").querySelector("span").innerHTML = `@${escapeHTML(un)}`; demoteBtn.outerHTML = `<button type="button" class="rs-promote-btn" data-username="${escapeHTML(un)}">Make mod</button>`; }

    })();

  async function createChatRoom(name, label, topic) {
    const result = await apiFetch("/api/chat/rooms", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, label, topic })
    });
    if (!result || result.error) {
      showToast(result?.error || "Could not create room.");
      return null;
    }
    await loadChatRooms();
    return result;
  }

  async function loadSidebar() {
    const list = document.getElementById("chatRoomList");
    if (!list) return;
    const conversations = await apiFetch(`/api/chat/conversations`);
    const items = [
      roomListItemHTML({ room: GLOBAL_ROOM, label: "Global", sub: "Everyone", active: currentRoom === GLOBAL_ROOM, avatarUser: undefined })
    ];
    (conversations || []).forEach(conv => {
      const peerUser = Progress.getUser(conv.with);
      const preview = conv.lastMessage ? escapeHTML(conv.lastMessage.body).slice(0, 40) : "";
      items.push(roomListItemHTML({
        room: conv.room,
        label: `@${conv.with}`,
        sub: preview,
        active: currentRoom === conv.room,
        avatarUser: peerUser,
        peer: conv.with,
        unreadCount: currentRoom === conv.room ? 0 : (conv.unreadCount || 0)
      }));
    });
    list.innerHTML = items.join("");
    list.querySelectorAll(".chat-room-item").forEach(btn => {
      btn.addEventListener("click", () => {
        switchRoom(btn.dataset.room, btn.dataset.label, btn.dataset.peer || null);
        closeChatSidebar(); // auto-close on mobile after picking a room
      });
    });

    // Keep the chat nav badge in sync: total unread across all DMs
    // (chat page itself always clears the badge on load, but this keeps
    // localStorage accurate so the badge is right on other pages too)
    const totalUnread = (conversations || []).reduce((s, c) => s + (c.unreadCount || 0), 0);
    try { localStorage.setItem("progress:dmUnread", String(totalUnread)); } catch (e) {}
  }

  // Track seen state per DM room
  const _seenByPeer = new Map(); // room -> last seen message id from peer

  function updateSeenTicks() {
    // Mark all my outgoing messages as "seen" if the other person has read past them
    const log = document.getElementById("chatLog");
    if (!log || !currentRoom.startsWith("dm:")) return;
    const myMsgs = Array.from(log.querySelectorAll(".chat-msg.mine"));
    if (!myMsgs.length) return;
    // Show "Seen" on the last outgoing message only
    myMsgs.forEach((el, i) => {
      const tick = el.querySelector(".chat-seen-tick");
      if (!tick) return;
      tick.textContent = "";
      tick.className = "chat-seen-tick";
    });
    const lastMine = myMsgs[myMsgs.length - 1];
    const tick = lastMine && lastMine.querySelector(".chat-seen-tick");
    if (tick && _seenByPeer.has(currentRoom)) {
      tick.textContent = "Seen";
      tick.classList.add("seen");
    } else if (tick) {
      tick.textContent = "Sent";
      tick.classList.add("sent");
    }
  }

  // ── Poll timer tick ──────────────────────────────────────────────────────────
  function tickPollTimers() {
    document.querySelectorAll(".poll-timer[data-closes]").forEach(el => {
      const closes = new Date(el.dataset.closes);
      const diff = closes - Date.now();
      if (diff <= 0) {
        el.textContent = " · closed";
        el.closest(".poll-card")?.querySelectorAll(".poll-option").forEach(b => b.disabled = true);
        return;
      }
      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      el.textContent = h > 0 ? ` · ${h}h ${m}m left` : ` · ${m}m left`;
    });
  }
  setInterval(tickPollTimers, 30000);

  // ── Pinned message bar ───────────────────────────────────────────────────────

  function updatePinnedBar(pinnedMsg) {
    const bar  = document.getElementById("pinnedBar");
    const text = document.getElementById("pinnedBarText");
    if (!bar || !text) return;
    if (pinnedMsg && !currentRoom.startsWith("dm:")) {
      text.textContent = `📌 ${pinnedMsg.author}: ${(pinnedMsg.body || "").slice(0, 80)}`;
      bar.style.display = "flex";
      bar._pinnedMsg = pinnedMsg;
    } else {
      bar.style.display = "none";
      bar._pinnedMsg = null;
    }
  }

  // ── Reaction picker ──────────────────────────────────────────────────────────

  const REACTION_EMOJIS = ["❤️", "😂", "😮", "😢", "😡", "👍"];

  function showReactionPicker(msgId, anchorEl) {
    document.getElementById("reactionPickerEl")?.remove();
    const picker = document.createElement("div");
    picker.id = "reactionPickerEl";
    picker.className = "reaction-picker";
    picker.innerHTML = REACTION_EMOJIS.map(e =>
      `<button type="button" class="rp-emoji" data-msg-id="${msgId}" data-emoji="${e}">${e}</button>`
    ).join("");
    document.body.appendChild(picker);
    const rect = anchorEl.getBoundingClientRect();
    picker.style.bottom = (window.innerHeight - rect.top + 4) + "px";
    picker.style.left = Math.min(rect.left, window.innerWidth - 220) + "px";
    const close = e => { if (!picker.contains(e.target)) { picker.remove(); document.removeEventListener("click", close, true); } };
    setTimeout(() => document.addEventListener("click", close, true), 10);
  }

  function switchRoom(room, label, peer) {
    if (room === currentRoom) return;
    currentRoom = room;
    currentPeer = peer || null;
    document.getElementById("chatRoomTitle").textContent = label;
    document.querySelectorAll(".chat-room-item").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.room === room);
    });
    closeSocket();
    typingUsers.forEach(t => clearTimeout(t));
    typingUsers.clear();
    renderTypingBar();
    loadHistory();
    connectSocket();
    updateChatHeader();
    updatePinnedBar(roomMap.get(room)?.pinnedMsg || null);
    const chatInput = document.getElementById("chatInput");
    if (chatInput) setTimeout(() => chatInput.focus(), 80);
    const url = new URL(location.href);
    if (peer) url.searchParams.set("with", peer); else url.searchParams.delete("with");
    history.replaceState(null, "", url);
    if (room.startsWith("dm:")) {
      apiFetch("/api/chat/mark-read", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ room })
      }).then(() => loadSidebar());
    }
    updateCallButtonVisibility();
    updateCommunityHeader();
    clearTimeout(_dmListenPollTimer);
    updateDmListenBanner();
  }

  function startDmFromInput() {
    const input = document.getElementById("newDmInput");
    const username = input.value.trim().replace(/^@/, "");
    if (!username) return;
    if (username.toLowerCase() === currentUser.username.toLowerCase()) {
      showToast("You can't message yourself.");
      return;
    }
    const target = Progress.getUser(username);
    if (!target) {
      showToast("Couldn't find that user.");
      return;
    }
    input.value = "";
    switchRoom(dmRoomId(currentUser.username, target.username), `@${target.username}`, target.username);
    loadSidebar();
  }

  function renderLoggedOut() {
    const wrap = document.getElementById("chatWrap");
    wrap.innerHTML = `

  let listenRailTimer = null;
  let _listenRailLoading = false; // prevent overlapping concurrent fetches

  // Renders the sidebar "Listen Together" rail: any active sessions (so you
  // can join and sync your own Spotify to them), plus a start/end control
  // for the current user's own session. Re-used on a light poll and on the
  // "listen-session-updated" event app.js fires after join/leave/end/sync.
  // Applies fresh session data onto an already-rendered card without tearing
  // down its DOM node, so the progress bar's CSS transition keeps flowing
  // smoothly instead of snapping/glitching back on every ~8s poll.
  function updateListenCardInPlace(cardEl, session) {
    const hasProgress = typeof session.progressMs === "number" && typeof session.durationMs === "number" && session.durationMs > 0;
    cardEl.classList.toggle("is-playing", !!session.isPlaying);
    cardEl.classList.toggle("is-paused", !session.isPlaying);

    // The rail polls every second, but the server only actually refreshes a
    // session's real Spotify position occasionally (on join/sync/detail
    // fetch) - most polls return byte-for-byte the same progress snapshot.
    // Only reset the ticking baseline when something genuinely changed
    // server-side; otherwise leave it alone so the smooth per-second ticker
    // (tickNowPlayingWidgets) keeps advancing the bar uninterrupted instead
    // of being yanked back to the same value every second.
    const serverStamp = String(session.updatedAt || "");
    const trackUri    = session.trackUri || "";
    // Also detect song rotation via URI change — new track means we must reset the
    // ticker baseline even if updatedAt happened to be unchanged.
    const changed = cardEl.dataset.serverUpdatedAt !== serverStamp
      || cardEl.dataset.isPlaying !== (session.isPlaying ? "1" : "0")
      || cardEl.dataset.trackUri  !== trackUri;

    if (hasProgress && changed) {
      cardEl.dataset.durationMs      = session.durationMs;
      cardEl.dataset.progressMs      = session.progressMs;
      cardEl.dataset.fetchedAt       = Date.now();
      cardEl.dataset.isPlaying       = session.isPlaying ? "1" : "0";
      cardEl.dataset.serverUpdatedAt = serverStamp;
      cardEl.dataset.trackUri        = trackUri;
    } else if (!hasProgress) {
      delete cardEl.dataset.durationMs;
      delete cardEl.dataset.progressMs;
      delete cardEl.dataset.fetchedAt;
      delete cardEl.dataset.isPlaying;
      delete cardEl.dataset.serverUpdatedAt;
      cardEl.dataset.trackUri = trackUri; // keep for future rotation detection
    }
    const trackEl = cardEl.querySelector(".now-playing-track");
    const artistEl = cardEl.querySelector(".now-playing-artist");
    if (trackEl) trackEl.textContent = session.trackName || "Nothing playing yet";
    if (artistEl) artistEl.textContent = session.artistNames || "";
    const countEl = cardEl.querySelector(".listen-session-count");
    if (countEl) countEl.textContent = `${session.participants.length} listening`;
    const artImg = cardEl.querySelector("img");
    if (artImg && session.albumArt && artImg.src !== session.albumArt) artImg.src = session.albumArt;
  }

  async function loadListenRail() {
    if (_listenRailLoading) return; // don't stack concurrent requests
    const rail = document.getElementById("chatListenRail");
    if (!rail) return;
    _listenRailLoading = true;
    let sessions;
    try {
      // fetchListenSessions() hits the list endpoint (fast, no Spotify call).
      // Then we fetch each session individually — that endpoint calls Spotify
      // and updates the DB, giving us the real current track, progress, and
      // rotation when the host skips to the next song.
      const stubs = await fetchListenSessions();
      sessions = await Promise.all(
        stubs.map(s => fetchListenSession(s.id).catch(() => s))
      );
    } catch (e) {
      sessions = [];
    } finally {
      _listenRailLoading = false;
    }
    const mySession = sessions.find(s => s.hostUsername === currentUser.username);
    const otherSessions = sessions.filter(s => s.hostUsername !== currentUser.username);
    const ordered = [mySession, ...otherSessions].filter(Boolean);

    const hasSpotify = currentUser.spotifyAccount && currentUser.spotifyAccount.connected;
    const startControl = mySession
      ? ""
      : hasSpotify
        ? `<button type="button" class="btn primary" id="startListenBtn" style="width:100%;">Start listening together</button>`
        : `<a href="profile.html?tab=settings" class="field-note" style="display:block;">Connect Spotify to start a listening session</a>`;

    let cardsContainer = rail.querySelector("#chatListenCards");
    const existingIds = cardsContainer
      ? Array.from(cardsContainer.querySelectorAll("[data-session-id]")).map(el => el.dataset.sessionId)
      : [];
    const newIds = ordered.map(s => s.id);
    const sameSet = cardsContainer && existingIds.length === newIds.length && existingIds.every((id, i) => id === newIds[i]);

    if (sameSet) {
      // Nothing structurally changed (same sessions, same order) - update each
      // card's numbers in place instead of rebuilding the DOM.
      ordered.forEach(session => {
        const cardEl = cardsContainer.querySelector(`[data-session-id="${session.id}"]`);
        if (cardEl) updateListenCardInPlace(cardEl, session);
      });
      // The start/end control can still change (e.g. participant count on my
      // own session's button area) - only the title/cards were preserved above.
      let controlSlot = rail.querySelector("#chatListenControl");
      if (controlSlot) controlSlot.innerHTML = startControl;
    } else {
      const cards = ordered.map(s => renderListenSessionCard(s)).join("");
      rail.innerHTML = `
        <div class="chat-listen-rail-title">Listen Together</div>
        <div id="chatListenCards">${cards}</div>
        <div id="chatListenControl">${startControl}</div>
      `;
    }

    const startBtn = document.getElementById("startListenBtn");
    if (startBtn) {
      startBtn.addEventListener("click", async () => {
        startBtn.disabled = true;
        startBtn.textContent = "Starting…";
        const session = await createListenSession();
        if (session) {
          showToast("Listening session started. Friends can join from here.");
          loadListenRail();
        } else {
          showToast("Couldn't start a session. Make sure Spotify is connected and playing.");
          startBtn.disabled = false;
          startBtn.textContent = "Start listening together";
        }
      });
    }
  }

    const commSearch = document.getElementById("communitySidebarSearch");
    if (commSearch) {
      let _commSearchTimer;
      commSearch.addEventListener("input", () => {
        clearTimeout(_commSearchTimer);
        _commSearchTimer = setTimeout(() => renderCommunitySidebar(commSearch.value), 200);
      });
    }

    // Community create button
    const communityCreateBtn = document.getElementById("communitySidebarCreateBtn");
    if (communityCreateBtn) communityCreateBtn.addEventListener("click", openCreateRoomModal);

    // Community explore button
    const communityExploreBtn = document.getElementById("communitySidebarExploreBtn");
    if (communityExploreBtn) communityExploreBtn.addEventListener("click", openExplorePanel);

    // Sidebar overlay click-to-close
    const overlay = document.getElementById("chatSidebarOverlay");
    if (overlay) overlay.addEventListener("click", closeChatSidebar);

    // Room search
    const roomSearch = document.getElementById("chatRoomSearch");
    if (roomSearch) {
      roomSearch.addEventListener("input", (e) => renderChatRooms(e.target.value));
    }

    // Create room form
    const roomCreateForm = document.getElementById("chatRoomCreateForm");
    if (roomCreateForm) {
      roomCreateForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("chatRoomName").value.trim();
        const label = document.getElementById("chatRoomLabel").value.trim();
        const topic = document.getElementById("chatRoomTopic")?.value.trim() || "";
        const room = await createChatRoom(name, label, topic);
        if (room) {
          showToast(`Created room #${label}`);
          document.getElementById("chatRoomName").value = "";
          document.getElementById("chatRoomLabel").value = "";
          if (document.getElementById("chatRoomTopic")) document.getElementById("chatRoomTopic").value = "";
        }
      });
    }

    // Drawer tab — tap to open
    const drawerTab = document.getElementById("chatDrawerTab");
    if (drawerTab) {
      drawerTab.addEventListener("click", openChatSidebar);
      drawerTab.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") openChatSidebar(); });
    }

    // Swipe right from left edge to open, swipe left anywhere to close
    const shell = wrap.querySelector(".chat-shell");
    if (shell) {
      let _tx = 0, _ty = 0;
      shell.addEventListener("touchstart", e => {
        _tx = e.touches[0].clientX; _ty = e.touches[0].clientY;
      }, { passive: true });
      shell.addEventListener("touchend", e => {
        const dx = e.changedTouches[0].clientX - _tx;
        const dy = e.changedTouches[0].clientY - _ty;
        if (Math.abs(dx) < Math.abs(dy) * 1.5) return;
        if (dx > 48 && _tx < 40) openChatSidebar();
        if (dx < -48) closeChatSidebar();
      }, { passive: true });
    }

    // Reply cancel
    const replyCancel = document.getElementById("chatReplyCancel");
    if (replyCancel) replyCancel.addEventListener("click", clearReplyContext);

    loadSidebar();
    loadChatRooms();
    loadHistory();
    connectSocket();
    applyChatPreferences();
    loadListenRail();
    if (listenRailTimer) clearInterval(listenRailTimer);
    // 30s is enough to catch song changes. tickNowPlayingWidgets() in app.js
    // already advances the progress bar every 1s locally without any API calls.
    listenRailTimer = setInterval(loadListenRail, 30000);

    // Fetch initial presence state
    apiFetch("/api/online-users").then(data => {
      if (data && data.statuses) {
        applyGlobalPresence(data.statuses);
      } else if (data && Array.isArray(data.users)) {
        const statuses = {};
        data.users.forEach(u => { statuses[u] = "online"; });
        applyGlobalPresence(statuses);
      }
    }).catch(() => {});

    updateChatHeader();

    // Show/hide call button when in a DM
    updateCallButtonVisibility();
  }

  // ── DM Listen-Together compact banner ───────────────────────────────────
  // When in a DM with someone who has an active listening session, show a
  // compact pill at the top of the chat so you can join without hunting the
  // sidebar.
  let _dmListenPollTimer = null;
  const SPOTIFY_ICON_SVG = `<svg width="16" height="16" viewBox="0 0 24 24" fill="#1DB954"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>`;

  async function updateDmListenBanner() {
    const banner = document.getElementById("dmListenBanner");
    if (!banner || !currentPeer) { if (banner) banner.style.display = "none"; return; }

    // Fetch session list and peer user data in parallel — neither depends on
    // the other, so there's no reason to wait for one before the other.
    const [sessions, peerUser] = await Promise.all([
      fetchListenSessions(),
      (async () => {
        let u = Progress.getUser(currentPeer);
        if (!u || !u.id) {
          // Not in local cache yet — fetch from API
          const r = await apiFetch(`/api/users?username=${encodeURIComponent(currentPeer)}`).catch(() => null);
          u = Array.isArray(r) ? r[0] : r;
        }
        return u || null;
      })()
    ]);

    const peerSession = sessions.find(s => s.hostUsername === currentPeer) || null;
    const peerId = peerUser && peerUser.id;

    // Fetch live now-playing directly from Spotify — works even without a
    // formal listen-together session, so the banner appears whenever the peer
    // is playing anything.
    let np = null;
    if (peerId) {
      const npData = await apiFetch(`/api/users/${encodeURIComponent(peerId)}/spotify/now-playing`).catch(() => null);
      if (npData && npData.playing) np = npData.playing;
    }

    // Nothing to show: no session and not actively playing → hide
    if (!peerSession && (!np || !np.isPlaying)) {
      banner.style.display = "none";
      clearTimeout(_dmListenPollTimer);
      _dmListenPollTimer = setTimeout(updateDmListenBanner, 5000);
      return;
    }

    // Prefer live Spotify data; fall back to session cache
    const trackName   = (np && np.trackName)   || (peerSession && peerSession.trackName)   || "Listening to something";
    const artistNames = (np && np.artistNames)  || (peerSession && peerSession.artistNames) || "";
    const albumArt    = (np && np.albumArt)     || (peerSession && peerSession.albumArt)    || null;
    const isPlaying   = np ? !!np.isPlaying     : (peerSession && peerSession.isPlaying !== false);
    const progressMs  = (np && typeof np.progressMs === "number") ? np.progressMs : (peerSession ? peerSession.progressMs || 0 : 0);
    const durationMs  = (np && typeof np.durationMs === "number") ? np.durationMs : (peerSession ? peerSession.durationMs || 0 : 0);

    const viewer = Progress.getCurrentUser();
    const joined = viewer && peerSession && peerSession.participants.includes(viewer.username);

    banner.style.display = "flex";
    banner.className = `dm-listen-banner${isPlaying ? "" : " is-paused"}`;

    const hasProg = durationMs > 0;
    const pct = hasProg ? Math.min(100, (progressMs / durationMs) * 100) : 0;
    if (hasProg) {
      banner.dataset.durationMs = durationMs;
      banner.dataset.progressMs = progressMs;
      banner.dataset.fetchedAt  = Date.now();
      banner.dataset.isPlaying  = isPlaying ? "1" : "0";
    } else {
      delete banner.dataset.durationMs;
    }

    const artEl = albumArt
      ? `<img class="dm-listen-art" src="${escapeHTML(albumArt)}" alt="">`
      : `<div class="dm-listen-art-fallback">${SPOTIFY_ICON_SVG}</div>`;

    // Action buttons only appear when a formal listen-together session exists.
    // When the banner is just showing passive now-playing, no buttons are shown.
    const actionButtons = peerSession
      ? (joined
          ? `<button type="button" class="dm-listen-action" data-action="sync" data-id="${peerSession.id}">Sync</button>
             <button type="button" class="dm-listen-action dm-listen-leave" data-action="leave" data-id="${peerSession.id}">Leave</button>`
          : `<button type="button" class="dm-listen-action" data-action="join" data-id="${peerSession.id}">Join</button>`)
      : "";

    banner.innerHTML = `
      ${artEl}
      <div class="dm-listen-eq"><span></span><span></span><span></span></div>
      <div class="dm-listen-info">
        <span class="dm-listen-banner-track">${escapeHTML(trackName)}</span>
        <span class="dm-listen-banner-artist">${escapeHTML(artistNames)}</span>
        ${hasProg ? `<div class="dm-listen-progress">
          <div class="dm-listen-progress-fill" style="width:${pct.toFixed(2)}%"></div>
        </div>` : ""}
      </div>
      ${actionButtons ? `<div class="dm-listen-actions">${actionButtons}</div>` : ""}
    `;

    banner.querySelectorAll(".dm-listen-action").forEach(btn => {
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        if (btn.dataset.action === "join") {
          await joinListenSession(btn.dataset.id);
          await syncMeToListenSession(btn.dataset.id);
          showToast("Joined and synced!");
        } else if (btn.dataset.action === "sync") {
          const r = await syncMeToListenSession(btn.dataset.id);
          showToast(r.synced ? "Synced!" : (r.reason || "Couldn't sync."));
        } else if (btn.dataset.action === "leave") {
          await leaveListenSession(btn.dataset.id);
        }
        updateDmListenBanner();
      });
    });

    clearTimeout(_dmListenPollTimer);
    _dmListenPollTimer = setTimeout(updateDmListenBanner, 5000);
  }

  // Populates the chat emoji popup (reusing the same emoticon set as
  // everywhere else in the app) and wires up: toggling it open/closed,
  // inserting a :name: token at the current cursor position on click, and
  // closing it on an outside click or after sending a message.
  let chatEmojiDocListenerAttached = false;

  // Sets up chat's sticker picker: builds the button grid, wires each one to
  // insert a :name: token at the cursor, and attaches the same hover-preview
  // tooltip used by the reply-form picker on post.html. The document-level
  // outside-click listener is only ever attached once (guarded by the flag
  // above) even though this function itself re-runs on every renderChat(),
  // so re-renders can't stack up duplicate close handlers.
  function setupChatEmojiPicker() {
    const picker = document.getElementById("chatEmojiPicker");
    const toggleBtn = document.getElementById("chatEmojiBtn");
    if (!picker || !toggleBtn) return;

    picker.innerHTML = getEmoticonNames().map(name => `
      <button type="button" class="emoji-btn" data-name="${name}">
        <img src="images/emoticons/${name}.png" alt="${name}">
      </button>
    `).join("");

    let tooltip = document.getElementById("chatEmojiTooltip");
    if (!tooltip) {
      tooltip = document.createElement("div");
      tooltip.id = "chatEmojiTooltip";
      tooltip.className = "emoji-tooltip hidden";
      document.body.appendChild(tooltip);
    }

    picker.querySelectorAll(".emoji-btn").forEach(btn => {
      const name = btn.dataset.name || "";

      btn.addEventListener("mouseenter", () => {
        tooltip.innerHTML = `
          <img src="images/emoticons/${name}.png" alt="${name}">
          <div class="emoji-tooltip-label${name.length > 10 ? " long-name" : ""}">:${name}:</div>
        `;
        tooltip.classList.remove("hidden");
        const rect = btn.getBoundingClientRect();
        const tooltipWidth = 120;
        const gap = 12;
        const left = Math.min(window.innerWidth - tooltipWidth - 12, Math.max(12, rect.left + rect.width / 2 - tooltipWidth / 2));
        const top = rect.top - tooltip.offsetHeight - gap;
        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top < 12 ? rect.bottom + gap : top}px`;
      });
      btn.addEventListener("mouseleave", () => tooltip.classList.add("hidden"));

      btn.addEventListener("click", () => {
        const textarea = document.getElementById("chatInput");
        if (!textarea) return;
        const placeholder = `:${name}:`;
        const start = textarea.selectionStart ?? textarea.value.length;
        const end = textarea.selectionEnd ?? textarea.value.length;
        const value = textarea.value;
        textarea.value = value.slice(0, start) + placeholder + value.slice(end);
        textarea.focus();
        textarea.selectionStart = textarea.selectionEnd = start + placeholder.length;
      });
    });

    toggleBtn.onclick = (e) => {
      e.stopPropagation();
      picker.classList.toggle("open");
    };

    picker.onclick = (e) => e.stopPropagation();

    if (!chatEmojiDocListenerAttached) {
      document.addEventListener("click", closeChatEmojiPicker);
      chatEmojiDocListenerAttached = true;
    }
  }

  function closeChatEmojiPicker() {
    const picker = document.getElementById("chatEmojiPicker");
    if (picker) picker.classList.remove("open");
    const tooltip = document.getElementById("chatEmojiTooltip");
    if (tooltip) tooltip.classList.add("hidden");
  }

  async function start() {
    initShell("chat");

    // Use whatever's already in localStorage — no waiting
    currentUser = Progress.getCurrentUser();

    if (!currentUser) {
        // Not logged in locally either — show logged-out state,
        // then try once more after the API responds
        renderLoggedOut();
        Progress.loadFromApi().then(() => {
            currentUser = Progress.getCurrentUser();
            if (currentUser) start();
        }).catch(() => {});
        return;
    }

    const params = new URLSearchParams(location.search);
    const withUsername = params.get("with");
    const inviteCode   = params.get("invite");
    if (withUsername && withUsername.toLowerCase() !== currentUser.username.toLowerCase()) {
        currentRoom = dmRoomId(currentUser.username, withUsername);
        currentPeer = withUsername;
    }

    renderChat();

    // Handle invite link — join room and switch to it
    if (inviteCode) {
      (async () => {
        const info = await apiFetch(`/api/invite/${encodeURIComponent(inviteCode)}`);
        if (!info || info.error) { showToast("Invalid or expired invite link."); return; }
        const joined = await apiFetch(`/api/invite/${encodeURIComponent(inviteCode)}/accept`, { method: "POST" });
        if (joined && joined.ok) {
          showToast(`Joined #${info.label}!`);
          await loadChatRooms();
          renderCommunitySidebar();
          switchRoom(info.room, `#${info.label}`, null);
          // Remove invite param from URL
          const cleanUrl = new URL(location.href);
          cleanUrl.searchParams.delete("invite");
          history.replaceState(null, "", cleanUrl);
        }
      })();
    }
    if (currentPeer) {
        document.getElementById("chatRoomTitle").textContent = `@${currentPeer}`;
    }
    // Refresh in the background — don't block anything on it
    Progress.loadFromApi().catch(() => {});
}

  function closeListenRailPolling() {
    if (listenRailTimer) { clearInterval(listenRailTimer); listenRailTimer = null; }
  }


  /* ============================================================
     WEBRTC VOICE CALL SYSTEM
     Signaling goes through the existing DM WebSocket room.
     Audio streams go peer-to-peer via WebRTC.
     ============================================================ */

  const ICE_SERVERS = [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" },
    { urls: "stun:stun2.l.google.com:19302" }
  ];

  let _callState = null; // null | "calling" | "receiving" | "connected"
  let _peerConn   = null;
  let _localStream = null;
  let _callPeer   = null;
  let _callTimer  = null;
  let _pendingOffer = null; // SDP from incoming offer, saved until user accepts

  function sendSignal(type, extra) {
    if (!socket || socket.readyState !== WebSocket.OPEN) return;
    socket.send(JSON.stringify({ type, from: currentUser.username, ...extra }));
  }

  async function startCall(targetUsername) {
    if (_callState) { showToast("Already in a call."); return; }
    if (!navigator.mediaDevices) { showToast("Your browser doesn't support voice calls."); return; }
    try {
      _localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    } catch (e) {
      showToast("Couldn't access your microphone. Check browser permissions.");
      return;
    }
    _callPeer  = targetUsername;
    _callState = "calling";
    renderCallOverlay("calling");

    _peerConn = buildPeerConn(targetUsername);
    _localStream.getTracks().forEach(t => _peerConn.addTrack(t, _localStream));
    _peerConn.onicecandidate = e => { if (e.candidate) sendSignal("call-ice", { candidate: e.candidate }); };

    const offer = await _peerConn.createOffer();
    await _peerConn.setLocalDescription(offer);
    sendSignal("call-offer", { sdp: offer });
  }

  function buildPeerConn(peer) {
    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    pc.ontrack = e => {
      let audio = document.getElementById("callRemoteAudio");
      if (!audio) {
        audio = document.createElement("audio");
        audio.id = "callRemoteAudio";
        audio.autoplay = true;
        document.body.appendChild(audio);
      }
      audio.srcObject = e.streams[0];
    };
    pc.onconnectionstatechange = () => {
      if (["disconnected","failed","closed"].includes(pc.connectionState)) {
        if (_callState === "connected") endCall(true);
      }
    };
    return pc;
  }

  async function handleCallOffer(from, sdp) {
    if (_callState) {
      // Already busy — auto-reject
      sendSignal("call-reject", {});
      return;
    }
    _callPeer = from;
    _callState = "receiving";
    _pendingOffer = sdp;
    renderCallOverlay("receiving");
    // Play a ring sound if we have the notification sound
    try { new Audio("sounds/notification.mp3").play().catch(() => {}); } catch(e) {}
  }

  async function acceptCall() {
    if (!_pendingOffer) return;
    if (!navigator.mediaDevices) { showToast("Your browser doesn't support voice calls."); rejectCall(); return; }
    try {
      _localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    } catch (e) {
      showToast("Couldn't access your microphone.");
      rejectCall();
      return;
    }
    _callState = "connected";
    _peerConn = buildPeerConn(_callPeer);
    _localStream.getTracks().forEach(t => _peerConn.addTrack(t, _localStream));
    _peerConn.onicecandidate = e => { if (e.candidate) sendSignal("call-ice", { candidate: e.candidate }); };
    await _peerConn.setRemoteDescription(new RTCSessionDescription(_pendingOffer));
    const answer = await _peerConn.createAnswer();
    await _peerConn.setLocalDescription(answer);
    sendSignal("call-answer", { sdp: answer });
    _pendingOffer = null;
    renderCallOverlay("connected");
    startCallTimer();
  }

  function rejectCall() {
    sendSignal("call-reject", {});
    endCall(true);
  }

  async function handleCallAnswer(from, sdp) {
    if (!_peerConn) return;
    await _peerConn.setRemoteDescription(new RTCSessionDescription(sdp));
    _callState = "connected";
    renderCallOverlay("connected");
    startCallTimer();
  }

  async function handleCallIce(candidate) {
    if (!_peerConn) return;
    try { await _peerConn.addIceCandidate(new RTCIceCandidate(candidate)); } catch (e) {}
  }

  function endCall(silent) {
    if (!silent) sendSignal("call-end", {});
    if (_peerConn) { _peerConn.close(); _peerConn = null; }
    if (_localStream) { _localStream.getTracks().forEach(t => t.stop()); _localStream = null; }
    clearInterval(_callTimer); _callTimer = null;
    _callState = null; _callPeer = null; _pendingOffer = null;
    const audio = document.getElementById("callRemoteAudio");
    if (audio) { audio.srcObject = null; audio.remove(); }
    const overlay = document.getElementById("callOverlay");
    if (overlay) { overlay.classList.remove("open"); setTimeout(() => overlay.remove(), 300); }
  }

  function startCallTimer() {
    let secs = 0;
    _callTimer = setInterval(() => {
      secs++;
      const m = Math.floor(secs / 60);
      const s = String(secs % 60).padStart(2, "0");
      const el = document.getElementById("callTimerEl");
      if (el) el.textContent = `${m}:${s}`;
    }, 1000);
  }

  let _muted = false;
  function toggleMute() {
    _muted = !_muted;
    if (_localStream) _localStream.getAudioTracks().forEach(t => t.enabled = !_muted);
    const muteBtn = document.getElementById("callMuteBtn");
    if (muteBtn) {
      muteBtn.classList.toggle("active", _muted);
      muteBtn.title = _muted ? "Unmute" : "Mute";
    }
  }

  function renderCallOverlay(state) {
    let overlay = document.getElementById("callOverlay");
    if (!overlay) {
      overlay = document.createElement("div");
      overlay.id = "callOverlay";
      overlay.className = "call-overlay";
      document.body.appendChild(overlay);
    }
    const user = Progress.getUser(_callPeer);
    const name = escapeHTML((user && user.name) || _callPeer || "Unknown");
    const av = avatarHTML(user, 72);
    const stateLabel = { calling: "Calling…", receiving: "Incoming call", connected: "Connected" }[state] || state;

    overlay.innerHTML = `
      <div class="call-card">
        <div class="call-avatar-wrap">${av}</div>
        <div class="call-name">${name}</div>
        <div class="call-state-label">${stateLabel}${state === "connected" ? ' · <span id="callTimerEl">0:00</span>' : ''}</div>
        <div class="call-controls">
          ${state === "receiving" ? `
            <button type="button" class="call-ctrl call-ctrl-accept" id="callAcceptBtn" title="Accept">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg>
            </button>
          ` : ""}
          ${state === "connected" ? `
            <button type="button" class="call-ctrl call-ctrl-mute" id="callMuteBtn" title="Mute">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            </button>
          ` : ""}
          <button type="button" class="call-ctrl call-ctrl-end" id="callEndBtn" title="${state === "receiving" ? "Decline" : "End call"}">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 6.5a9 9 0 0 0-11 0l-2-2A12 12 0 0 1 12 1a12 12 0 0 1 7.5 3.5l-2 2zm-8.8 3.3a5 5 0 0 1 6.6 0l2-2a8 8 0 0 0-10.6 0l2 2zM15.9 12l2-2a5 5 0 0 0-.4-.5L15.4 11.6c.2.1.4.3.5.4zm-2.4 2.4L12 15.9l-1.5-1.5a5 5 0 0 1-.4-.5L12 12l1.9 1.9a5 5 0 0 1-.4.5z" transform="rotate(135 12 12)"/><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg>
          </button>
        </div>
      </div>`;
    overlay.classList.add("open");
    const acceptBtn = document.getElementById("callAcceptBtn");
    if (acceptBtn) acceptBtn.addEventListener("click", acceptCall);
    const endBtn = document.getElementById("callEndBtn");
    if (endBtn) endBtn.addEventListener("click", () => { if (_callState === "receiving") rejectCall(); else endCall(); });
    const muteBtn = document.getElementById("callMuteBtn");
    if (muteBtn) muteBtn.addEventListener("click", toggleMute);
  }

  window.addEventListener("beforeunload", () => { closeSocket(); closeListenRailPolling(); endCall(true); });

  // ── Community Discovery ─────────────────────────────────────────────────────

  const DISCOVER_GRADIENTS = [
    ["#3a7ca5","#1b4965"], ["#7c3a7c","#3d1a4a"], ["#3a7c5a","#1a4a2e"],
    ["#7c5a3a","#4a2e1a"], ["#7c3a4a","#4a1a28"], ["#3a5a7c","#1a2e4a"],
    ["#5a7c3a","#2e4a1a"], ["#6a4a7c","#3a1a5a"], ["#7c6a3a","#4a3a1a"],
    ["#3a7c7c","#1a4a4a"],
  ];

  function roomCardGradient(roomName) {
    let h = 5381;
    for (const c of String(roomName || "")) h = ((h << 5) + h) ^ c.charCodeAt(0);
    const [a, b] = DISCOVER_GRADIENTS[Math.abs(h) % DISCOVER_GRADIENTS.length];
    return `linear-gradient(135deg, ${a} 0%, ${b} 100%)`;
  }

  function openDiscovery() {
    const existing = document.getElementById("chatDiscoveryOverlay");
    if (existing) { existing.classList.add("open"); renderDiscoveryGrid(""); return; }

    const overlay = document.createElement("div");
    overlay.className = "discovery-overlay";
    overlay.id = "chatDiscoveryOverlay";
    overlay.innerHTML = `
      <div class="discovery-header">
        <button type="button" class="discovery-close" id="discoveryCloseBtn" aria-label="Close">✕</button>
        <div class="discovery-title">Communities</div>
        <input type="search" class="discovery-search" id="discoverySearch" placeholder="Search communities…" autocomplete="off">
      </div>
      <div class="discovery-body">
        <div class="discovery-section-label">All rooms</div>
        <div class="discovery-grid" id="discoveryGrid"></div>
      </div>
    `;
    document.body.appendChild(overlay);
    requestAnimationFrame(() => overlay.classList.add("open"));

    document.getElementById("discoveryCloseBtn").addEventListener("click", closeDiscovery);
    document.getElementById("discoverySearch").addEventListener("input", (e) => {
      renderDiscoveryGrid(e.target.value);
    });

    // Escape to close
    const escHandler = (e) => {
      if (e.key === "Escape") { closeDiscovery(); document.removeEventListener("keydown", escHandler); }
    };
    document.addEventListener("keydown", escHandler);

    renderDiscoveryGrid("");
    document.getElementById("discoverySearch")?.focus();
  }

  function closeDiscovery() {
    const overlay = document.getElementById("chatDiscoveryOverlay");
    if (!overlay) return;
    overlay.classList.remove("open");
    setTimeout(() => overlay.remove(), 220);
  }

  function renderCommunitySidebar(filter) {
    const list = document.getElementById("communitySidebarList");
    if (!list) return;
    const fl = (filter || "").trim().toLowerCase();
    // Sidebar only shows rooms you've joined
    const allRooms = [...roomMap.values()];
    const joinedRooms = allRooms.filter(r => r.joined);
    const rooms = joinedRooms.filter(r => !fl ||
      r.label.toLowerCase().includes(fl) ||
      (r.topic || "").toLowerCase().includes(fl) ||
      r.room.toLowerCase().includes(fl));

    if (!joinedRooms.length) {
      list.innerHTML = `<div style="padding:16px 10px;color:var(--muted);font-size:13px;line-height:1.5;">You haven't joined any communities yet.<br>Hit <strong>Explore</strong> to find one!</div>`;
      return;
    }
    if (!rooms.length) {
      list.innerHTML = `<div style="padding:16px 10px;color:var(--muted);font-size:13px;">No matches.</div>`;
      return;
    }

    list.innerHTML = rooms.map(r => {
      const accentColor = r.color || (roomCardGradient(r.room).match(/#[0-9a-f]{6}/gi) || ["#8C6E58"])[0];
      const initials = r.label.slice(0, 2).toUpperCase();
      const isActive = currentRoom === r.room;
      const count = r.memberCount || 0;
      const avatarStyle = r.icon
        ? `background:url(${escapeHTML(r.icon)}) center/cover; color:transparent;`
        : `background:${accentColor};`;
      const iOwnThis = r.createdBy && r.createdBy === (currentUser?.username || "");
      return `<div class="community-item${isActive ? " active" : ""}" data-room="${escapeHTML(r.room)}" role="button" tabindex="0">
        <div class="community-avatar" style="${avatarStyle}" title="${iOwnThis ? "You own this" : ""}">${r.icon ? "" : initials}</div>
        <div class="community-info">
          <div class="community-name">${escapeHTML(r.label)}${iOwnThis ? `<span style="font-size:11px;margin-left:4px;" title="You own this community">👑</span>` : ""}</div>
          <div class="community-topic">👥 ${count} member${count !== 1 ? "s" : ""}${r.topic ? ` · ${escapeHTML(r.topic)}` : ""}</div>
        </div>
      </div>`;
    }).join("");

    list.querySelectorAll(".community-item[data-room]").forEach(item => {
      const go = () => {
        const room = item.dataset.room;
        const info = roomMap.get(room);
        if (info) { switchRoom(room, `#${info.label}`, null); closeChatSidebar(); }
      };
      item.addEventListener("click", go);
      item.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") go(); });
    });
  }

  function renderDiscoveryGrid(filter) {
    const grid = document.getElementById("discoveryGrid");
    if (!grid) return;
    const fl = (filter || "").trim().toLowerCase();
    const rooms = [...roomMap.values()]
      .filter(r => !fl ||
        r.label.toLowerCase().includes(fl) ||
        (r.topic || "").toLowerCase().includes(fl) ||
        r.room.toLowerCase().includes(fl))
      .slice(0, 48);

    const createCardHTML = `
      <div class="discovery-card create-card" id="discoveryCreateCard" role="button" tabindex="0">
        <div class="discovery-card-plus">+</div>
        <p class="discovery-card-title">Create your own</p>
        <p class="discovery-card-sub">Start a new community room</p>
      </div>`;

    const roomCards = rooms.map(r => {
      const bg = r.image
        ? `background:${roomCardGradient(r.room)};`
        : `background:${roomCardGradient(r.room)};`;
      const imgTag = r.image
        ? `<img class="discovery-card-bg" src="${escapeHTML(r.image)}" alt="" loading="lazy">`
        : "";
      return `
        <div class="discovery-card" data-room="${escapeHTML(r.room)}" style="${bg}" role="button" tabindex="0">
          ${imgTag}
          <div class="discovery-card-overlay"></div>
          <p class="discovery-card-title">${escapeHTML(r.label)}</p>
          <p class="discovery-card-sub">${escapeHTML(r.topic || "No topic set")}</p>
        </div>`;
    }).join("");

    grid.innerHTML = createCardHTML + (rooms.length ? roomCards : `<div style="grid-column:1/-1;color:var(--muted);font-size:14px;padding:20px 0;">No communities found.</div>`);

    const createCard = document.getElementById("discoveryCreateCard");
    if (createCard) {
      createCard.addEventListener("click", openCreateRoomModal);
      createCard.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") openCreateRoomModal(); });
    }

    grid.querySelectorAll(".discovery-card[data-room]").forEach(card => {
      const joinRoom = () => {
        const room = card.dataset.room;
        const roomInfo = roomMap.get(room);
        if (roomInfo) {
          switchRoom(room, `#${roomInfo.label}`, null);
          closeDiscovery();
        }
      };
      card.addEventListener("click", joinRoom);
      card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") joinRoom(); });
    });
  }

  // ── Explore Panel ──────────────────────────────────────────────────────────

  function roomCardGradientForExplore(roomId) {
    // Reuse existing roomCardGradient if defined, otherwise generate
    if (typeof roomCardGradient === "function") return roomCardGradient(roomId);
    const hue = roomId.split("").reduce((n, c) => n + c.charCodeAt(0), 0) % 360;
    return `linear-gradient(135deg, hsl(${hue},45%,38%) 0%, hsl(${(hue+40)%360},50%,28%) 100%)`;
  }

  function renderExploreGrid(filter) {
    const grid = document.getElementById("exploreGrid");
    if (!grid) return;
    const fl = (filter || "").trim().toLowerCase();
    const rooms = [...roomMap.values()]
      .filter(r => !fl ||
        r.label.toLowerCase().includes(fl) ||
        (r.topic || "").toLowerCase().includes(fl) ||
        r.room.toLowerCase().includes(fl));

    const createCard = `
      <div class="explore-card-create" id="explorePanelCreateCard" role="button" tabindex="0">
        <div class="explore-card-create-icon">✦</div>
        <div class="explore-card-create-label">Create community</div>
      </div>`;

    const ROLE_WEIGHTS_LOCAL = { owner: 5, moderator: 4, analyst: 3, email_writer: 2, tester: 1 };
    const userRole = currentUser?.adminRole || "";
    const isMod = (ROLE_WEIGHTS_LOCAL[userRole] || 0) >= ROLE_WEIGHTS_LOCAL["moderator"];
    const myUsername = currentUser?.username || "";

    const roomCards = rooms.map(r => {
      const accentColor = r.color || (roomCardGradientForExplore(r.room).match(/#[0-9a-f]{6}/gi) || ["#8C6E58"])[0];
      const bg = r.image
        ? `url(${escapeHTML(r.image)}) center/cover no-repeat`
        : r.color ? `linear-gradient(135deg,${r.color}cc,${r.color}88)` : roomCardGradientForExplore(r.room);
      const joined = r.joined;
      const count = r.memberCount || 0;
      const canManageThis = isMod || r.createdBy === myUsername;
      const iconHTML = r.icon
        ? `<img src="${escapeHTML(r.icon)}" style="width:32px;height:32px;border-radius:9px;object-fit:cover;border:2px solid rgba(255,255,255,.5);flex-shrink:0;" alt="">`
        : `<div style="width:32px;height:32px;border-radius:9px;background:${accentColor};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0;border:2px solid rgba(255,255,255,.3);">${r.label.slice(0,2).toUpperCase()}</div>`;
      return `
        <div class="explore-card" data-room="${escapeHTML(r.room)}"
             style="background:${bg};" role="button" tabindex="0">
          <div class="explore-card-overlay"></div>
          <div style="position:relative;z-index:2;display:flex;align-items:center;gap:6px;margin-bottom:6px;">
            ${joined ? `<span style="font-size:10px;background:rgba(255,255,255,.22);color:#fff;padding:2px 7px;border-radius:20px;font-weight:700;letter-spacing:.04em;">JOINED</span>` : ""}
            <span style="font-size:10px;color:rgba(255,255,255,.7);">👥 ${count}</span>
            ${canManageThis ? `<button class="explore-card-gear" data-manage="${escapeHTML(r.room)}" title="Edit" style="margin-left:auto;background:rgba(0,0,0,.35);border:none;cursor:pointer;font-size:13px;padding:2px 6px;border-radius:8px;color:#fff;line-height:1;z-index:3;position:relative;" onclick="event.stopPropagation()">⚙️</button>` : ""}
          </div>
          <div style="position:relative;z-index:2;display:flex;align-items:center;gap:8px;">
            ${iconHTML}
            <div style="min-width:0;">
              <p class="explore-card-name" style="margin:0 0 2px;">${escapeHTML(r.label)}</p>
              <p class="explore-card-topic">${escapeHTML(r.topic || "")}</p>
            </div>
          </div>
        </div>`;
    }).join("");

    grid.innerHTML = createCard + (rooms.length
      ? roomCards
      : `<div class="explore-empty">No communities yet — be the first!</div>`);

    document.getElementById("explorePanelCreateCard")?.addEventListener("click", () => {
      closeExplorePanel();
      openCreateRoomModal();
    });

    // Gear buttons on cards — open settings panel without navigating to room
    grid.querySelectorAll(".explore-card-gear[data-manage]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const roomId = btn.dataset.manage;
        const info = roomMap.get(roomId);
        if (info) openRoomSettingsPanel(roomId, info);
      });
    });

    grid.querySelectorAll(".explore-card[data-room]").forEach(card => {
      card.addEventListener("click", () => {
        const room = card.dataset.room;
        const info = roomMap.get(room);
        if (info) {
          // Auto-join on first visit
          if (!info.joined) joinRoom(room);
          closeExplorePanel();
          switchRoom(room, `#${info.label}`, null);
          closeChatSidebar();
        }
      });
      card.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") card.click();
      });
    });
  }

  function openExplorePanel() {
    if (document.getElementById("explorePanelEl")) return;
    const chatPanel = document.querySelector(".chat-panel");
    if (!chatPanel) return;
    chatPanel.style.position = "relative";

    const panel = document.createElement("div");
    panel.className = "explore-panel";
    panel.id = "explorePanelEl";
    panel.innerHTML = `
      <div class="explore-panel-head">
        <button type="button" class="explore-panel-back" id="explorePanelBack" aria-label="Close explore">←</button>
        <h2 class="explore-panel-title">Discover communities</h2>
      </div>
      <div class="explore-search-wrap">
        <input type="search" class="explore-search" id="explorePanelSearch" placeholder="Search rooms…" autocomplete="off">
      </div>
      <div class="explore-grid-wrap">
        <div class="explore-grid" id="exploreGrid"></div>
      </div>
    `;
    chatPanel.appendChild(panel);
    requestAnimationFrame(() => panel.classList.add("open"));

    renderExploreGrid();

    document.getElementById("explorePanelBack").addEventListener("click", closeExplorePanel);

    const searchEl = document.getElementById("explorePanelSearch");
    let _searchTimer;
    searchEl.addEventListener("input", () => {
      clearTimeout(_searchTimer);
      _searchTimer = setTimeout(() => renderExploreGrid(searchEl.value), 200);
    });
    searchEl.addEventListener("keydown", e => { if (e.key === "Escape") closeExplorePanel(); });

    setTimeout(() => searchEl?.focus(), 80);
  }

  function closeExplorePanel() {
    const panel = document.getElementById("explorePanelEl");
    if (!panel) return;
    panel.classList.remove("open");
    setTimeout(() => panel.remove(), 240);
  }

  // Cat emojis + layout for scattered background
  const CC_CATS = [
    { e:"🐱", top:"6%",  left:"6%",  sz:"30px", rot:"-14deg", op:.08, dur:"7s",  delay:"0s"   },
    { e:"😸", top:"4%",  left:"68%", sz:"38px", rot:"10deg",  op:.07, dur:"8s",  delay:"1s"   },
    { e:"🐾", top:"16%", right:"5%", sz:"22px", rot:"25deg",  op:.09, dur:"6s",  delay:"2s"   },
    { e:"😺", top:"38%", left:"2%",  sz:"32px", rot:"-6deg",  op:.07, dur:"9s",  delay:".5s"  },
    { e:"🐾", top:"55%", right:"4%", sz:"26px", rot:"18deg",  op:.08, dur:"7.5s",delay:"1.5s" },
    { e:"🐈", top:"72%", left:"7%",  sz:"28px", rot:"-20deg", op:.07, dur:"8.5s",delay:"3s"   },
    { e:"🙀", top:"82%", left:"52%", sz:"34px", rot:"8deg",   op:.06, dur:"6.5s",delay:"2.5s" },
    { e:"😹", top:"88%", right:"8%", sz:"24px", rot:"-12deg", op:.09, dur:"7s",  delay:".8s"  },
    { e:"🐾", top:"11%", left:"38%", sz:"18px", rot:"4deg",   op:.06, dur:"9s",  delay:"2s"   },
    { e:"🌸", top:"62%", left:"38%", sz:"20px", rot:"-18deg", op:.07, dur:"8s",  delay:"1.2s" },
    { e:"🐱", top:"46%", left:"68%", sz:"22px", rot:"30deg",  op:.08, dur:"6s",  delay:"3.5s" },
    { e:"✨", top:"28%", left:"18%", sz:"16px", rot:"-3deg",  op:.07, dur:"7s",  delay:"0.3s" },
    { e:"🐾", top:"20%", left:"55%", sz:"20px", rot:"15deg",  op:.06, dur:"9.5s",delay:"4s"   },
  ];

  function openCreateRoomModal() {
    if (document.getElementById("createCommunityPanel")) return;

    // Inject into .chat-panel so it stays inside the chat area
    const chatPanel = document.querySelector(".chat-panel");
    if (!chatPanel) return;
    chatPanel.style.position = "relative"; // ensure stacking context

    const panel = document.createElement("div");
    panel.className = "create-community-panel";
    panel.id = "createCommunityPanel";

    // Scattered cats
    const catHtml = CC_CATS.map(c => {
      const posStyle = c.right
        ? `top:${c.top};right:${c.right};`
        : `top:${c.top};left:${c.left};`;
      return `<span class="cc-cat" style="${posStyle}--cc-sz:${c.sz};--cc-rot:${c.rot};--cc-op:${c.op};--cc-dur:${c.dur};--cc-delay:${c.delay};">${c.e}</span>`;
    }).join("");

    panel.innerHTML = `
      <div class="cc-cats">${catHtml}</div>
      <div class="create-community-card">
        <div class="cc-header">
          <div class="cc-icon">🐱</div>
          <div>
            <div class="cc-title">New community</div>
            <p class="cc-sub">Create a room for your crew to hang out in.</p>
          </div>
        </div>
        <div class="cc-field">
          <label class="cc-label" for="crNameInput">Room ID</label>
          <input class="cc-input" type="text" id="crNameInput" placeholder="e.g. book-club" autocomplete="off" spellcheck="false" maxlength="40">
        </div>
        <div class="cc-field">
          <label class="cc-label" for="crLabelInput">Display name</label>
          <input class="cc-input" type="text" id="crLabelInput" placeholder="e.g. Book Club" autocomplete="off" maxlength="50">
        </div>
        <div class="cc-field">
          <label class="cc-label" for="crTopicInput">Topic <span style="opacity:.5;font-size:9px;">(optional)</span></label>
          <input class="cc-input" type="text" id="crTopicInput" placeholder="What's this room about?" autocomplete="off" maxlength="120">
        </div>
        <div class="cc-error" id="crErrorMsg"></div>
        <div class="cc-actions">
          <button type="button" class="cc-cancel" id="crCancelBtn">Cancel</button>
          <button type="button" class="cc-submit" id="crSubmitBtn">✦ Create community</button>
        </div>
      </div>
    `;

    chatPanel.appendChild(panel);
    requestAnimationFrame(() => panel.classList.add("open"));

    document.getElementById("crCancelBtn").addEventListener("click", closeCreateRoomModal);

    document.getElementById("crSubmitBtn").addEventListener("click", async () => {
      const name  = document.getElementById("crNameInput").value.trim();
      const label = document.getElementById("crLabelInput").value.trim();
      const topic = document.getElementById("crTopicInput").value.trim();
      const errEl = document.getElementById("crErrorMsg");
      if (!name)  { errEl.textContent = "Room ID is required."; document.getElementById("crNameInput").focus(); return; }
      if (!label) { errEl.textContent = "Display name is required."; document.getElementById("crLabelInput").focus(); return; }
      errEl.textContent = "";
      const btn = document.getElementById("crSubmitBtn");
      btn.disabled = true; btn.textContent = "Creating…";
      const room = await createChatRoom(name, label, topic);
      if (room) {
        closeCreateRoomModal();
        showToast(`✓ #${label} created!`);
        renderCommunitySidebar(document.getElementById("communitySidebarSearch")?.value || "");
        switchRoom(room.room, `#${room.label}`, null);
      } else {
        btn.disabled = false; btn.textContent = "✦ Create community";
        errEl.textContent = "That room ID might already be taken.";
      }
    });

    ["crNameInput","crLabelInput","crTopicInput"].forEach(id => {
      document.getElementById(id)?.addEventListener("keydown", (e) => {
        if (e.key === "Enter") document.getElementById("crSubmitBtn")?.click();
        if (e.key === "Escape") closeCreateRoomModal();
      });
    });

    setTimeout(() => document.getElementById("crNameInput")?.focus(), 80);
  }

  function closeCreateRoomModal() {
    const panel = document.getElementById("createCommunityPanel");
    if (!panel) return;
    panel.classList.remove("open");
    setTimeout(() => panel.remove(), 240);
  }

  // ── Report modal ────────────────────────────────────────────────────────────
  (function initReportModal() {
    let _pending = null;
    let _selectedReason = null;

    const modal   = document.getElementById("reportModal");
    const preview = document.getElementById("reportPreview");
    const submit  = document.getElementById("reportSubmit");

    function closeModal() {
      modal.classList.remove("open");
      _pending = null;
      _selectedReason = null;
      submit.disabled = true;
      document.querySelectorAll(".report-reason-chip").forEach(c => c.classList.remove("sel"));
    }

    document.getElementById("reportCancel").addEventListener("click", closeModal);
    modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });

    document.querySelectorAll(".report-reason-chip").forEach(chip => {
      chip.addEventListener("click", () => {
        document.querySelectorAll(".report-reason-chip").forEach(c => c.classList.remove("sel"));
        chip.classList.add("sel");
        _selectedReason = chip.dataset.reason;
        submit.disabled = false;
      });
    });

    submit.addEventListener("click", async () => {
      if (!_pending || !_selectedReason) return;
      submit.disabled = true;
      submit.textContent = "Submitting…";
      const result = await apiFetch("/api/chat/reports", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ..._pending, reason: _selectedReason })
      });
      closeModal();
      submit.textContent = "Submit report";
      if (result && result.ok) showToast("✓ Report submitted. We'll review it.");
      else showToast(result?.error || "Couldn't submit report.");
    });

    // Global open function called by the click handler
    window.openReportModal = function({ messageId, author, body, room }) {
      _pending = { messageId, author, body, room };
      _selectedReason = null;
      submit.disabled = true;
      document.querySelectorAll(".report-reason-chip").forEach(c => c.classList.remove("sel"));
      preview.textContent = body ? `"${body.slice(0, 80)}${body.length > 80 ? "…" : ""}"` : "(no text)";
      modal.classList.add("open");
    };
  })();

  start();
</script>

</body>
