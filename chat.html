<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>(function(){try{var t=localStorage.getItem("progressTheme");var dark=(t==="dark")||(t!=="light"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);if(dark)document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
<style>
/* ── Sidebar tabs ───────────────────────────────────────────────── */
.sidebar-tabs {
  display: flex; border-bottom: 1px solid var(--mocha-light);
  flex-shrink: 0; padding: 0 6px;
}
.sidebar-tab {
  flex: 1; padding: 11px 6px; font-size: 11px; font-weight: 700;
  letter-spacing: .07em; text-transform: uppercase; background: none; border: none;
  color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s; font-family: var(--font-body);
}
.sidebar-tab.active { color: var(--ink); border-bottom-color: var(--ink); }
.sidebar-panel { display: none; flex: 1; min-height: 0; flex-direction: column; }
.sidebar-panel.active { display: flex; }

/* Communities panel in sidebar */
.community-search-wrap {
  padding: 10px 10px 6px; flex-shrink: 0;
}
.community-search {
  width: 100%; box-sizing: border-box;
  padding: 8px 12px; border: 1.5px solid var(--mocha-light); border-radius: 20px;
  font-family: var(--font-body); font-size: 13px;
  background: var(--paper); color: var(--ink); transition: border-color .15s;
}
.community-search:focus { outline: none; border-color: var(--ink); }
.community-list { flex: 1; overflow-y: auto; padding: 4px 6px 8px; }
.community-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 8px; border-radius: 10px; cursor: pointer;
  transition: background .12s;
}
.community-item:hover, .community-item.active { background: var(--mocha-wash); }
.community-avatar {
  width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: #fff; letter-spacing: -.01em;
}
.community-info { min-width: 0; flex: 1; }
.community-name { font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.community-topic { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.community-create-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 10px; border-radius: 10px;
  background: none; border: 1.5px dashed var(--mocha-light); color: var(--muted);
  font-size: 13px; font-weight: 600; cursor: pointer; width: 100%;
  font-family: var(--font-body); transition: border-color .15s, color .15s, background .12s;
  text-align: left; box-sizing: border-box;
}
.community-create-btn:hover { border-color: var(--ink); color: var(--ink); background: var(--mocha-wash); }
.community-explore-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 10px; border-radius: 10px;
  background: var(--ink); color: var(--cream);
  border: none; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%;
  font-family: var(--font-body); transition: opacity .15s;
  text-align: left; box-sizing: border-box;
}
.community-explore-btn:hover { opacity: .85; }

/* ── Discovery Overlay (kept for reference, now unused) ─────────── */
.discovery-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: var(--paper); display: flex; flex-direction: column;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.discovery-overlay.open { opacity: 1; pointer-events: all; }
.discovery-header {
  padding: 20px 28px 16px; border-bottom: 1px solid var(--mocha-light);
  flex-shrink: 0; position: relative;
}
.discovery-close {
  position: absolute; top: 16px; right: 20px;
  background: none; border: none; font-size: 20px; cursor: pointer;
  color: var(--muted); line-height: 1; padding: 6px 8px; border-radius: 8px;
}
.discovery-close:hover { background: var(--mocha-light); color: var(--ink); }
.discovery-title {
  font-family: var(--font-display); font-style: italic; font-size: 24px;
  margin: 0 0 14px; color: var(--ink);
}
.discovery-search {
  width: 100%; max-width: 520px; box-sizing: border-box;
  padding: 10px 18px; border: 1.5px solid var(--mocha-light); border-radius: 24px;
  font-family: var(--font-body); font-size: 14px;
  background: var(--paper); color: var(--ink);
  transition: border-color .15s;
}
.discovery-search:focus { outline: none; border-color: var(--ink); }
.discovery-body { flex: 1; overflow-y: auto; padding: 24px 28px; }
.discovery-section-label {
  font-family: var(--font-mono); font-size: 10px; text-transform: uppercase;
  letter-spacing: .08em; color: var(--muted); margin: 0 0 14px;
}
.discovery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}
.discovery-card {
  border-radius: 20px; min-height: 190px; position: relative; cursor: pointer;
  overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
  padding: 20px; transition: transform .16s, box-shadow .16s;
}
.discovery-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,.18); }
.discovery-card-bg {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; z-index: 0;
}
.discovery-card-overlay {
  position: absolute; inset: 0; z-index: 1;
  background: linear-gradient(to top, rgba(0,0,0,.55) 0%, rgba(0,0,0,.05) 60%);
}
.discovery-card-plus {
  font-size: 44px; color: rgba(255,255,255,.9); line-height: 1;
  margin-bottom: 12px; z-index: 2; position: relative;
}
.discovery-card-title {
  font-family: var(--font-display); font-size: 17px; font-weight: 600;
  color: #fff; margin: 0 0 5px; z-index: 2; position: relative;
}
.discovery-card-sub {
  font-size: 13px; color: rgba(255,255,255,.78); margin: 0;
  z-index: 2; position: relative;
}
.discovery-card.create-card {
  border: 2px dashed rgba(255,255,255,.32);
  background: linear-gradient(135deg, #2c6e8a 0%, #1a4a5e 100%);
}
/* ── Create Community In-Panel View ─────────────────────────────── */
.create-community-panel {
  position: absolute; inset: 0; z-index: 20;
  background: var(--paper);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  opacity: 0; pointer-events: none;
  transition: opacity .22s;
}
.create-community-panel.open { opacity: 1; pointer-events: all; }

/* floating cat decorations */
.cc-cats { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.cc-cat {
  position: absolute; user-select: none; line-height: 1;
  opacity: var(--cc-op, .07); font-size: var(--cc-sz, 26px);
  transform: rotate(var(--cc-rot, 0deg));
  animation: cc-float var(--cc-dur, 6s) ease-in-out infinite alternate;
  animation-delay: var(--cc-delay, 0s);
}
@keyframes cc-float {
  from { transform: rotate(var(--cc-rot, 0deg)) translateY(0px); }
  to   { transform: rotate(var(--cc-rot, 0deg)) translateY(-10px); }
}

.create-community-card {
  position: relative; z-index: 2;
  background: var(--paper);
  border: 1.5px solid var(--mocha-light);
  border-radius: 28px; padding: 36px 36px 30px;
  width: calc(100% - 56px); max-width: 400px;
  box-shadow: 0 8px 40px rgba(59,37,24,.1);
  transform: translateY(20px) scale(.97); transition: transform .28s;
}
.create-community-panel.open .create-community-card {
  transform: translateY(0) scale(1);
}
.cc-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 22px; }
.cc-icon { font-size: 42px; line-height: 1; flex-shrink: 0; }
.cc-title { font-family: var(--font-display); font-style: italic; font-size: 24px; color: var(--ink); margin: 0 0 4px; }
.cc-sub { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.5; }

.cc-field { margin-bottom: 13px; }
.cc-label {
  display: block; font-family: var(--font-mono); font-size: 10px;
  text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
  margin-bottom: 5px;
}
.cc-input {
  display: block; width: 100%; box-sizing: border-box;
  padding: 11px 14px;
  border: 1.5px solid var(--mocha-light); border-radius: 12px;
  font-family: var(--font-body); font-size: 14px;
  background: var(--paper); color: var(--ink);
  transition: border-color .15s; outline: none;
}
.cc-input:focus { border-color: var(--ink); }
.cc-input::placeholder { color: var(--muted); opacity: .7; }

.cc-actions { display: flex; gap: 10px; margin-top: 20px; }
.cc-cancel {
  flex: 1; padding: 11px; background: none;
  border: 1.5px solid var(--mocha-light); border-radius: 12px;
  font-family: var(--font-body); font-size: 14px; color: var(--muted);
  cursor: pointer; transition: background .15s, border-color .15s;
}
.cc-cancel:hover { background: var(--mocha-wash); border-color: var(--mocha); }
.cc-submit {
  flex: 2; padding: 11px; background: var(--ink); color: var(--cream);
  border: none; border-radius: 12px; font-family: var(--font-body);
  font-size: 14px; font-weight: 700; cursor: pointer; transition: opacity .15s;
}
.cc-submit:hover { opacity: .85; }
.cc-submit:disabled { opacity: .5; cursor: not-allowed; }
.cc-error { font-size: 12px; color: var(--danger); margin-top: 8px; min-height: 16px; }
/* ── Community header bar (join/leave + meta) ───────────────────── */
.community-header-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 8px 18px; background: var(--mocha-wash);
  border-bottom: 1px solid var(--mocha-light); flex-shrink: 0; flex-wrap: wrap;
}
.community-header-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.community-header-name { font-weight: 700; font-size: 13px; color: var(--ink); }
.community-header-topic { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.community-header-count { font-size: 12px; color: var(--muted); white-space: nowrap; }
.community-header-join-btn {
  flex-shrink: 0; padding: 6px 16px; border-radius: 20px; font-size: 13px;
  font-weight: 700; cursor: pointer; border: none; font-family: var(--font-body);
  transition: opacity .15s;
}
.community-header-join-btn.join { background: var(--ink); color: var(--cream); }
.community-header-join-btn.leave { background: none; border: 1.5px solid var(--mocha-light); color: var(--muted); }
.community-header-join-btn:hover { opacity: .8; }
.community-header-join-btn:disabled { opacity: .5; cursor: not-allowed; }
.community-header-gear {
  flex-shrink: 0; background: none; border: none; cursor: pointer;
  font-size: 16px; padding: 4px 6px; border-radius: 8px; color: var(--muted);
  line-height: 1; transition: background .14s, color .14s;
}
.community-header-gear:hover { background: var(--mocha-light); color: var(--ink); }
/* ── Room Settings Panel — Discord-style ─────────────────────────── */
.room-settings-panel {
  position: absolute; inset: 0; z-index: 30;
  background: var(--cream); display: flex; flex-direction: column;
  opacity: 0; transition: opacity .2s; overflow: hidden;
}
.room-settings-panel.open { opacity: 1; }
.room-settings-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px 12px; border-bottom: 1px solid var(--mocha-light); flex-shrink: 0;
}
.room-settings-back {
  background: none; border: none; cursor: pointer; font-size: 18px;
  color: var(--muted); padding: 4px 7px; border-radius: 8px;
  transition: background .14s, color .14s; line-height: 1;
}
.room-settings-back:hover { background: var(--mocha-light); color: var(--ink); }
.room-settings-title {
  font-size: 14px; font-weight: 700; color: var(--ink); margin: 0; flex: 1;
}
/* Scrollable body */
.room-settings-body {
  flex: 1; overflow-y: auto; overscroll-behavior: contain;
  padding: 0 0 24px; display: flex; flex-direction: column;
}
/* Cover banner */
.rs-cover {
  width: 100%; height: 100px; position: relative; cursor: pointer;
  background: var(--mocha-light); overflow: hidden; flex-shrink: 0;
}
.rs-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rs-cover-overlay {
  position: absolute; inset: 0; background: rgba(0,0,0,.35);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity .18s; gap: 6px;
  font-size: 12px; font-weight: 700; color: #fff;
}
.rs-cover:hover .rs-cover-overlay { opacity: 1; }
.rs-cover-empty {
  width: 100%; height: 100%; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 5px;
  font-size: 11px; color: var(--muted); font-weight: 600;
}
.rs-cover-empty span { font-size: 22px; }
/* Icon */
.rs-icon-row {
  display: flex; align-items: flex-end; gap: 12px;
  padding: 0 16px; margin-top: -24px; margin-bottom: 16px; position: relative; z-index: 2;
}
.rs-icon {
  width: 52px; height: 52px; border-radius: 14px; cursor: pointer; position: relative;
  flex-shrink: 0; overflow: hidden; border: 3px solid var(--cream);
  background: var(--mocha-light);
}
.rs-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rs-icon-initials {
  width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 800; color: #fff;
}
.rs-icon-overlay {
  position: absolute; inset: 0; background: rgba(0,0,0,.45);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity .15s; font-size: 16px;
}
.rs-icon:hover .rs-icon-overlay { opacity: 1; }
.rs-icon-hint { font-size: 11px; color: var(--muted); padding-bottom: 4px; }

/* Sections */
.rs-section { padding: 0 16px; margin-bottom: 4px; }
.rs-section-divider {
  margin: 16px 16px 14px; border: none; border-top: 1px solid var(--mocha-light);
}
.rs-label {
  font-size: 10.5px; font-weight: 800; color: var(--muted);
  text-transform: uppercase; letter-spacing: .07em; margin-bottom: 6px;
}
.rs-input {
  width: 100%; box-sizing: border-box;
  padding: 9px 12px; border-radius: 10px; border: 1.5px solid var(--mocha-light);
  background: var(--mocha-wash); color: var(--ink); font-size: 14px;
  font-family: var(--font-body); outline: none; transition: border-color .15s;
  resize: vertical;
}
.rs-input:focus { border-color: var(--ink); }
.rs-textarea { min-height: 68px; line-height: 1.5; }
/* URL hint below image inputs */
.rs-url-row { display: flex; gap: 6px; margin-top: 6px; }
.rs-url-input { flex: 1; }
.rs-url-clear {
  padding: 9px 12px; border-radius: 10px; border: 1.5px solid var(--mocha-light);
  background: none; color: var(--muted); cursor: pointer; font-size: 14px;
  font-family: var(--font-body); transition: background .14s, color .14s;
  white-space: nowrap;
}
.rs-url-clear:hover { background: var(--mocha-light); color: var(--ink); }
/* Color swatches */
.rs-colors { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.rs-color-swatch {
  width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: none;
  transition: transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .15s;
  flex-shrink: 0;
}
.rs-color-swatch:hover { transform: scale(1.2); }
.rs-color-swatch.selected { box-shadow: 0 0 0 2.5px var(--cream), 0 0 0 4.5px currentColor; }
.rs-color-custom {
  padding: 5px 10px; border-radius: 20px; border: 1.5px solid var(--mocha-light);
  background: none; color: var(--muted); font-size: 12px; cursor: pointer;
  font-family: var(--font-body); font-weight: 600; white-space: nowrap;
  transition: border-color .14s, color .14s;
}
.rs-color-custom:hover { border-color: var(--ink); color: var(--ink); }
.rs-color-hex {
  padding: 5px 10px; border-radius: 8px; border: 1.5px solid var(--mocha-light);
  background: var(--mocha-wash); color: var(--ink); font-size: 12px;
  font-family: var(--font-mono); width: 88px; outline: none;
  transition: border-color .15s;
}
.rs-color-hex:focus { border-color: var(--ink); }
/* Privacy toggle */
.rs-toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.rs-toggle-info { display: flex; flex-direction: column; gap: 2px; }
.rs-toggle-label { font-size: 13px; font-weight: 600; color: var(--ink); }
.rs-toggle-sub { font-size: 11px; color: var(--muted); }
.rs-toggle {
  width: 42px; height: 24px; border-radius: 12px; border: none; cursor: pointer; padding: 0;
  background: var(--mocha-light); position: relative; transition: background .2s; flex-shrink: 0;
}
.rs-toggle.on { background: #22c55e; }
.rs-toggle::after {
  content: ''; position: absolute; top: 3px; left: 3px;
  width: 18px; height: 18px; border-radius: 50%; background: #fff;
  transition: left .2s cubic-bezier(.34,1.56,.64,1);
  box-shadow: 0 1px 4px rgba(0,0,0,.2);
}
.rs-toggle.on::after { left: 21px; }
/* Status + buttons */
.rs-status { font-size: 12px; min-height: 16px; color: var(--muted); margin: 0 16px 10px; }
.rs-save-btn {
  margin: 0 16px 8px; padding: 11px; border-radius: 12px; border: none; cursor: pointer;
  background: var(--ink); color: var(--cream); font-size: 14px;
  font-weight: 700; font-family: var(--font-body); transition: opacity .15s;
}
.rs-save-btn:hover { opacity: .85; }
.rs-save-btn:disabled { opacity: .45; cursor: not-allowed; }
/* Danger zone */
.rs-danger-zone {
  margin: 4px 16px 0; padding: 14px; border-radius: 12px;
  border: 1.5px solid rgba(224,80,80,.35);
  background: rgba(224,80,80,.04);
}
.rs-danger-title {
  font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em;
  color: #e05050; margin-bottom: 10px;
}
.rs-delete-btn {
  width: 100%; padding: 10px; border-radius: 10px; border: 1.5px solid #e05050; cursor: pointer;
  background: none; color: #e05050; font-size: 13px; font-weight: 700;
  font-family: var(--font-body); transition: background .15s, color .15s;
}
.rs-delete-btn:hover { background: #e05050; color: #fff; }
.rs-delete-btn:disabled { opacity: .45; cursor: not-allowed; }

/* ── Explore Panel (in-panel full view) ─────────────────────────── */
.explore-panel {
  position: absolute; inset: 0; z-index: 20;
  background: var(--paper);
  display: flex; flex-direction: column;
  opacity: 0; pointer-events: none;
  transition: opacity .22s;
}
.explore-panel.open { opacity: 1; pointer-events: all; }
.explore-panel-head {
  padding: 18px 24px 14px;
  border-bottom: 1px solid var(--mocha-light);
  flex-shrink: 0; display: flex; align-items: center; gap: 14px;
}
.explore-panel-back {
  background: none; border: none; cursor: pointer; color: var(--muted);
  font-size: 18px; line-height: 1; padding: 6px 8px; border-radius: 8px;
  transition: background .12s, color .12s; flex-shrink: 0;
}
.explore-panel-back:hover { background: var(--mocha-wash); color: var(--ink); }
.explore-panel-title {
  font-family: var(--font-display); font-style: italic; font-size: 20px;
  color: var(--ink); margin: 0; flex: 1;
}
.explore-search-wrap { padding: 14px 24px 10px; flex-shrink: 0; }
.explore-search {
  width: 100%; box-sizing: border-box;
  padding: 10px 16px; border: 1.5px solid var(--mocha-light); border-radius: 22px;
  font-family: var(--font-body); font-size: 14px;
  background: var(--paper); color: var(--ink); transition: border-color .15s;
  outline: none;
}
.explore-search:focus { border-color: var(--ink); }
.explore-grid-wrap { flex: 1; overflow-y: auto; padding: 4px 20px 24px; }
.explore-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px; padding-top: 8px;
}
.explore-card {
  border-radius: 18px; min-height: 140px; position: relative;
  cursor: pointer; overflow: hidden;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 16px; transition: transform .16s, box-shadow .16s;
}
.explore-card:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(0,0,0,.18); }
.explore-card-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.6) 0%, rgba(0,0,0,.05) 65%);
}
.explore-card-name {
  font-family: var(--font-display); font-size: 15px; font-weight: 600;
  color: #fff; margin: 0 0 3px; position: relative; z-index: 2; line-height: 1.2;
}
.explore-card-topic {
  font-size: 11px; color: rgba(255,255,255,.78);
  position: relative; z-index: 2; margin: 0;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
.explore-card-create {
  background: var(--mocha-wash);
  border: 2px dashed var(--mocha-light);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px;
  border-radius: 18px; min-height: 140px; cursor: pointer;
  transition: border-color .15s, background .15s;
}
.explore-card-create:hover { border-color: var(--ink); background: var(--mocha-light); }
.explore-card-create-icon { font-size: 28px; line-height: 1; }
.explore-card-create-label {
  font-size: 13px; font-weight: 600; color: var(--muted);
  font-family: var(--font-body);
}
.explore-empty {
  grid-column: 1/-1; text-align: center; padding: 40px 0;
  color: var(--muted); font-size: 14px;
}

/* ── Discover button in sidebar ─────────────────────────────────── */
.chat-discover-btn {
  display: flex; align-items: center; gap: 9px; width: 100%;
  padding: 10px 14px; background: none; border: 1.5px solid var(--mocha-light);
  border-radius: 12px; cursor: pointer; font-family: var(--font-body);
  font-size: 13.5px; font-weight: 500; color: var(--ink); margin-bottom: 12px;
  transition: background .15s;
}
.chat-discover-btn:hover { background: var(--mocha-light); }
</style>
</head>
<body>

<div id="nav-root"></div>
<div id="modal-root"></div>

<!-- Report modal -->
<div id="reportModal">
  <div class="report-modal-box">
    <h3>🚩 Report message</h3>
    <div class="report-modal-preview" id="reportPreview"></div>
    <div>
      <div style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;">Reason</div>
      <div class="report-reasons" id="reportReasons">
        <button class="report-reason-chip" data-reason="spam">Spam</button>
        <button class="report-reason-chip" data-reason="harassment">Harassment</button>
        <button class="report-reason-chip" data-reason="hate">Hate speech</button>
        <button class="report-reason-chip" data-reason="misinformation">Misinformation</button>
        <button class="report-reason-chip" data-reason="inappropriate">Inappropriate</button>
        <button class="report-reason-chip" data-reason="other">Other</button>
      </div>
    </div>
    <div class="report-modal-actions">
      <button class="report-cancel-btn" id="reportCancel">Cancel</button>
      <button class="report-submit-btn" id="reportSubmit" disabled>Submit report</button>
    </div>
  </div>
</div>

<div id="chatSidebarOverlay" class="chat-sidebar-overlay"></div>

<!-- Left-edge drawer pull tab — tap or swipe to open the room list -->
<div class="chat-drawer-tab" id="chatDrawerTab" role="button" aria-label="Open conversations" tabindex="0">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="9 18 15 12 9 6"/>
  </svg>
</div>

<main class="chat-page-main">
  <div class="chat-wrap" id="chatWrap">
    <!-- filled by JS -->
  </div>
</main>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
  const GLOBAL_ROOM = "global";
  const HISTORY_LIMIT = 50;
  const ROLE_WEIGHTS_CLIENT = { owner: 5, moderator: 4, analyst: 3, email_writer: 2, tester: 1 };
  const LOCAL_CHAT_INSTANCE = `${Math.random().toString(36).slice(2)}-${Date.now()}`;
  const CHAT_BROADCAST_KEY = "progress-chat-broadcast";

  let socket = null;
  let reconnectDelay = 1000;
  let reconnectTimer = null;
  let manuallyClosed = false;
  let typingHintTimer = null;
  let lastTypingSent = 0;
  let seenMessageIds = new Set();
  let chatChannel = null;
  let presenceUsers = new Set();
  let chatStorageReceiver = false;
  let lastPresenceBroadcast = 0;
  let lastRenderedDateKey = null;

  // Grouping: track last appended message to collapse consecutive same-author messages
  let lastGroupAuthor = null;
  let lastGroupTime   = null;

  // Online presence: username → "online" | "idle" | "offline"
  const onlineStatuses = new Map();

  // Reply context
  let replyContext = null;

  // Scroll-to-bottom unread counter
  let scrollUnreadCount = 0;

  // Song pending to send
  let songPending = null;
  let songSearchTimer = null;
  let previewAudio = null;

  let oldestMessageTime = null;
  let hasMoreHistory = true;
  let loadingMoreHistory = false;
  let messageCache = new Map();
  let roomMap = new Map();

  let currentUser = null;
  let currentRoom = GLOBAL_ROOM;
  let currentPeer = null; // username, or null for the global room

  function dmRoomId(a, b) {
    return "dm:" + [a, b].sort().join(":");
  }

  function wsUrl(room) {
    return `${WS_BASE}/ws/chat?room=${encodeURIComponent(room)}&token=${encodeURIComponent(getAuthToken())}`;
  }

  function setStatus(text, cls) {
    const el = document.getElementById("chatStatus");
    if (!el) return;
    el.textContent = text;
    el.className = "chat-status" + (cls ? ` ${cls}` : "");
  }

  function updateScrollBtn() {
    const log = document.getElementById("chatLog");
    const btn = document.getElementById("chatScrollBtn");
    const countEl = document.getElementById("chatScrollCount");
    if (!log || !btn) return;
    const distFromBottom = log.scrollHeight - log.scrollTop - log.clientHeight;
    const show = distFromBottom > 160;
    btn.classList.toggle("visible", show);
    if (!show) { scrollUnreadCount = 0; }
    if (countEl) {
      countEl.textContent = scrollUnreadCount > 0 ? scrollUnreadCount : "";
      countEl.classList.toggle("has-count", scrollUnreadCount > 0);
    }
  }

  function scrollToBottom(force, smooth) {
    const log = document.getElementById("chatLog");
    if (!log) return;
    const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 120;
    if (force || nearBottom) {
      if (smooth) {
        log.scrollTo({ top: log.scrollHeight, behavior: "smooth" });
      } else {
        log.scrollTop = log.scrollHeight;
      }
      scrollUnreadCount = 0;
      updateScrollBtn();
    }
  }

  function messageRow(msg, grouped) {
    // System join message — render inline centered pill
    if (msg.type === "join") {
      return `<div class="chat-join-msg" data-id="${escapeHTML(msg.id)}" data-time="${msg.time}">${escapeHTML(msg.body)}</div>`;
    }
    const author = Progress.getUser(msg.author);
    const mine = currentUser && msg.author === currentUser.username;
    const imageHTML = msg.image ? `<div class="chat-image"><img src="${msg.image}" alt="Shared image" loading="lazy"></div>` : "";
    const replyHTML = msg.replyTo ? `
      <div class="chat-reply-quote" data-target-id="${escapeHTML(msg.replyTo.id)}">
        <span class="chat-reply-quote-author">@${escapeHTML(msg.replyTo.author)}</span>
        <span class="chat-reply-quote-body">${escapeHTML((msg.replyTo.body || "📷 Image").slice(0, 120))}</span>
      </div>` : "";
    // Song card
    let songCardHTML = "";
    if (msg.type === "song" && msg.songData) {
      const s = msg.songData;
      const artEl = s.albumArt
        ? `<img class="chat-song-art" src="${escapeHTML(s.albumArt)}" alt="">`
        : `<div class="chat-song-art-fallback">♪</div>`;
      // Wrap the whole card in a Spotify link; add play button only if preview exists
      const spotifyHref = escapeHTML(s.spotifyUrl || "#");
      const playBtn = s.previewUrl
        ? `<button type="button" class="chat-song-preview-btn" data-preview="${escapeHTML(s.previewUrl)}" aria-label="Preview 30s">
             <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
           </button>`
        : "";
      songCardHTML = `<a class="chat-song-card" href="${spotifyHref}" target="_blank" rel="noopener" aria-label="Open on Spotify">
        ${artEl}
        <div class="chat-song-info">
          <span class="chat-song-name">${escapeHTML(s.name)}</span>
          <span class="chat-song-artist">${escapeHTML(s.artists)}</span>
          <div class="chat-song-spotify-badge">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="#1DB954"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
            Open on Spotify
          </div>
        </div>
        ${playBtn}
      </a>`;
    }

    // Game card
    let gameCardHTML = "";
    if (msg.type === "game" && msg.gameData) {
      const g = msg.gameData;
      let gameInner = "";
      if (g.gameType === "wyr") {
        gameInner = `<div class="chat-game-options">
          <button type="button" class="chat-game-option" data-game-id="${escapeHTML(msg.id)}" data-choice="a">${escapeHTML(g.optionA)}</button>
          <button type="button" class="chat-game-option" data-game-id="${escapeHTML(msg.id)}" data-choice="b">${escapeHTML(g.optionB)}</button>
        </div>`;
      } else if (g.gameType === "word") {
        gameInner = `<div class="chat-game-options"><button type="button" class="chat-game-option" data-game-id="${escapeHTML(msg.id)}" data-choice="reply">Reply with a word →</button></div>`;
      } else if (g.gameType === "emoji") {
        gameInner = `<div class="chat-game-options"><button type="button" class="chat-game-option" data-game-id="${escapeHTML(msg.id)}" data-choice="emoji">Add an emoji →</button></div>`;
      }
      const icons = { wyr: "🤔", word: "💬", emoji: "✨" };
      const labels = { wyr: "Would You Rather", word: "Word Association", emoji: "Emoji Story" };
      gameCardHTML = `<div class="chat-game-card">
        <div class="chat-game-tag">${icons[g.gameType] || "🎮"} ${escapeHTML(labels[g.gameType] || "Game")}</div>
        <div class="chat-game-body">${escapeHTML(g.prompt)}</div>
        ${gameInner}
      </div>`;
    }

    // Poll card
    let pollCardHTML = "";
    if (msg.type === "poll" && msg.pollData) {
      const p = msg.pollData;
      const totalVotes = Object.values(msg.votes || {}).reduce((s, arr) => s + arr.length, 0);
      const myVote = Object.keys(msg.votes || {}).find(k => (msg.votes[k] || []).includes(currentUser?.username));
      const isClosed = msg.closesAt && new Date(msg.closesAt) < new Date();
      const optionBtns = p.options.map((opt, i) => {
        const count = (msg.votes?.[i] || []).length;
        const pct = totalVotes > 0 ? Math.round(count / totalVotes * 100) : 0;
        const voted = String(i) === String(myVote);
        return `<button type="button" class="poll-option${voted ? " voted" : ""}${isClosed ? " closed" : ""}" data-msg-id="${escapeHTML(msg.id)}" data-opt="${i}" ${isClosed ? "disabled" : ""}>
          <span class="poll-option-bar" style="width:${pct}%"></span>
          <span class="poll-option-label">${escapeHTML(opt)}</span>
          <span class="poll-option-pct">${(myVote !== undefined || isClosed) ? pct + "%" : ""}</span>
        </button>`;
      }).join("");
      const closedBadge = isClosed ? `<span class="poll-closed-badge">Closed</span>` :
        msg.closesAt ? `<span class="poll-timer" data-closes="${escapeHTML(msg.closesAt)}"></span>` : "";
      pollCardHTML = `<div class="poll-card">
        <div class="poll-card-q">${escapeHTML(p.question)} ${closedBadge}</div>
        <div class="poll-card-opts">${optionBtns}</div>
        <div class="poll-card-meta">${totalVotes} vote${totalVotes !== 1 ? "s" : ""}</div>
      </div>`;
    }

    // Reactions
    const reactions = msg.reactions || {};
    const reactionHTML = Object.keys(reactions).length ? `<div class="msg-reactions">
      ${Object.entries(reactions).map(([e, users]) => {
        const mine2 = users.includes(currentUser?.username);
        return `<button type="button" class="reaction-pill${mine2 ? " me" : ""}" data-msg-id="${escapeHTML(msg.id)}" data-emoji="${escapeHTML(e)}" title="${escapeHTML(users.join(", "))}">${e} ${users.length}</button>`;
      }).join("")}
      <button type="button" class="reaction-add-btn" data-msg-id="${escapeHTML(msg.id)}" title="Add reaction">+</button>
    </div>` : `<div class="msg-reactions"><button type="button" class="reaction-add-btn" data-msg-id="${escapeHTML(msg.id)}" title="Add reaction">+</button></div>`;

    const bodyHTML = songCardHTML || gameCardHTML || pollCardHTML ||
      ((msg.body || replyHTML) ? `<div class="chat-bubble">${replyHTML}${msg.body ? renderMentionsInHTML(renderEmoticonsText(msg.body, "inline-emoticon")) : ""}</div>` : "");
    return `
      <div class="chat-msg ${mine ? "mine" : ""} ${grouped ? "grouped" : ""}" data-id="${msg.id}" data-time="${msg.time}">
        ${!mine ? `<a href="user.html?username=${encodeURIComponent(msg.author)}" class="chat-avatar">${avatarHTML(author, 30)}</a>` : ""}
        <div class="chat-bubble-col">
          <div class="chat-reply-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg>
          </div>
          ${!mine && !currentRoom.startsWith("dm:") && !grouped ? (() => {
            const roomDoc = roomMap.get(currentRoom);
            const roomOwner = roomDoc?.createdBy;
            const communityMods = roomDoc?.communityMods || [];
            const isOwner = roomOwner && msg.author === roomOwner;
            const isCMod = communityMods.includes(msg.author);
            return `<span class="chat-author"><a href="user.html?username=${encodeURIComponent(msg.author)}" style="color:inherit;text-decoration:none;">@${escapeHTML(msg.author)}</a>${isOwner ? `<span class="chat-owner-badge">👑 Owner</span>` : isCMod ? `<span class="chat-mod-badge">🛡 Mod</span>` : ""}</span>`;
          })() : ""}
          ${imageHTML}
          ${bodyHTML}
          ${!currentRoom.startsWith("dm:") ? reactionHTML : ""}
          <div class="chat-meta-row">
            <span class="chat-time">${Progress.timeAgo(msg.time)}</span>
            ${!mine ? `<button type="button" class="chat-report-btn" data-report-id="${escapeHTML(msg.id)}" data-report-author="${escapeHTML(msg.author)}" data-report-body="${escapeHTML(msg.body || "").replace(/"/g, '&quot;')}" aria-label="Report message">🚩 Report</button>` : ""}
            ${mine && currentRoom.startsWith("dm:") ? '<span class="chat-seen-tick" id="seen-' + msg.id + '"></span>' : ""}
          </div>
        </div>
      </div>`;
  }

  function dateSeparatorLabel(isoTime) {
    const msgDate = new Date(isoTime);
    const today = new Date();
    if (msgDate.toDateString() === today.toDateString()) return "Today";
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);
    if (msgDate.toDateString() === yesterday.toDateString()) return "Yesterday";
    const sameYear = msgDate.getFullYear() === today.getFullYear();
    return msgDate.toLocaleDateString(undefined, sameYear ? { month: "long", day: "numeric" } : { month: "long", day: "numeric", year: "numeric" });
  }

  const linkPreviewCache = new Map();

  function extractFirstUrl(text) {
    const match = (text || "").match(/https?:\/\/[^\s<]+/i);
    return match ? match[0] : null;
  }

  async function attachLinkPreview(msg) {
    const url = extractFirstUrl(msg.body);
    if (!url) return;
    const bubbleCol = document.querySelector(`.chat-msg[data-id="${msg.id}"] .chat-bubble-col`);
    if (!bubbleCol) return;

    let preview;
    if (linkPreviewCache.has(url)) {
      preview = linkPreviewCache.get(url);
    } else {
      const result = await apiFetch(`/api/link-preview?url=${encodeURIComponent(url)}`);
      preview = (result && result.preview) || null;
      linkPreviewCache.set(url, preview);
    }
    if (!preview) return;

    const card = document.createElement("a");
    card.className = "chat-link-preview";
    card.href = preview.url;
    card.target = "_blank";
    card.rel = "noopener noreferrer";
    card.innerHTML = `
      ${preview.image ? `<img src="${preview.image}" alt="">` : ""}
      <div class="chat-link-preview-body">
        ${preview.siteName ? `<div class="chat-link-preview-site">${escapeHTML(preview.siteName)}</div>` : ""}
        ${preview.title ? `<div class="chat-link-preview-title">${escapeHTML(preview.title)}</div>` : ""}
        ${preview.description ? `<div class="chat-link-preview-desc">${escapeHTML(preview.description)}</div>` : ""}
      </div>
    `;
    const timeEl = bubbleCol.querySelector(".chat-time");
    if (timeEl) bubbleCol.insertBefore(card, timeEl);
    else bubbleCol.appendChild(card);
    scrollToBottom();
  }

  function appendMessage(msg, animate) {
    if (seenMessageIds.has(msg.id)) return;
    seenMessageIds.add(msg.id);
    messageCache.set(msg.id, true);
    const log = document.getElementById("chatLog");
    if (!log) return;
    const empty = log.querySelector(".chat-empty");
    if (empty) empty.remove();

    const dayKey = new Date(msg.time).toDateString();
    if (dayKey !== lastRenderedDateKey) {
      lastRenderedDateKey = dayKey;
      lastGroupAuthor = null; // reset grouping on date break
      lastGroupTime = null;
      log.insertAdjacentHTML("beforeend", `<div class="chat-date-separator"><span>${dateSeparatorLabel(msg.time)}</span></div>`);
    }

    // Determine grouping: same author, within 3 minutes, no date separator just inserted
    const msgTime = new Date(msg.time);
    const grouped = lastGroupAuthor === msg.author
      && lastGroupTime
      && (msgTime - lastGroupTime) < 180000;

    lastGroupAuthor = msg.author;
    lastGroupTime = msgTime;

    log.insertAdjacentHTML("beforeend", messageRow(msg, grouped));

    const msgEl = log.querySelector(`[data-id="${msg.id}"]`);
    if (msgEl) {
      if (animate) msgEl.classList.add("chat-msg-new");
      addSwipeToReply(msgEl, msg);
      // Clicking a reply quote scrolls to the original message
      msgEl.querySelectorAll(".chat-reply-quote").forEach(q => {
        q.addEventListener("click", () => scrollToMessage(q.dataset.targetId));
      });
    }

    // If user scrolled up and this is an incoming (animated) message, bump count
    if (animate) {
      const log2 = document.getElementById("chatLog");
      if (log2) {
        const distFromBottom = log2.scrollHeight - log2.scrollTop - log2.clientHeight;
        if (distFromBottom > 160) {
          scrollUnreadCount++;
          updateScrollBtn();
        }
      }
    }
    if (animate) {
      // Defer one frame so the browser finishes layout before we measure
      // scrollHeight — otherwise smooth scroll can land short of the real bottom.
      requestAnimationFrame(() => {
        const l = document.getElementById("chatLog");
        if (l) { l.scrollTo({ top: l.scrollHeight, behavior: "smooth" }); scrollUnreadCount = 0; updateScrollBtn(); }
      });
    } else {
      scrollToBottom(false, false); // history load: instant snap
    }
    attachLinkPreview(msg);
  }

  function renderPresence(users) {
    const el = document.getElementById("chatPresence");
    if (!el) return;
    const unique = Array.from(new Set(users || []));
    if (currentRoom === GLOBAL_ROOM) {
      el.textContent = unique.length ? (unique.length === 1 ? `@${unique[0]} is here` : `${unique.length} here now`) : "";
    } else if (!currentRoom.startsWith("dm:")) {
      // Community room — show live online count
      el.textContent = unique.length ? `🟢 ${unique.length} online` : "";
    } else {
      el.textContent = "";
    }
  }

  // ── Online presence ──────────────────────────────────────────────────────────

  function applyGlobalPresence(statuses) {
    onlineStatuses.clear();
    for (const [u, s] of Object.entries(statuses || {})) onlineStatuses.set(u, s);
    updatePresenceDots();
    updateChatHeader();
  }

  function updatePresenceDots() {
    document.querySelectorAll(".chat-room-item[data-peer]").forEach(item => {
      const peer = item.dataset.peer;
      if (!peer) return;
      const status = onlineStatuses.get(peer) || "offline";
      const wrap = item.querySelector(".chat-room-av-wrap");
      if (!wrap) return;
      let dot = wrap.querySelector(".chat-room-presence");
      if (status === "offline") { if (dot) dot.remove(); return; }
      if (!dot) {
        dot = document.createElement("div");
        wrap.appendChild(dot);
      }
      dot.className = `chat-room-presence${status === "idle" ? " idle" : ""}`;
    });
  }

  function updateChatHeader() {
    const peerEl     = document.getElementById("chatHeaderPeer");
    const titleEl    = document.getElementById("chatRoomTitle");
    const presenceEl = document.getElementById("chatPresence");
    if (!peerEl) return;

    if (currentPeer) {
      const peerUser = Progress.getUser(currentPeer);
      const status   = onlineStatuses.get(currentPeer) || "offline";
      const statusLabels = { online: "online", idle: "away", offline: "offline" };
      const profileUrl = `user.html?username=${encodeURIComponent(currentPeer)}`;

      // Rebuild the peer area as a single clickable link
      peerEl.innerHTML = `
        <a href="${profileUrl}" class="chat-header-peer-link" title="View @${escapeHTML(currentPeer)}'s profile">
          <div class="chat-header-peer-avatar">
            ${avatarHTML(peerUser, 34)}
            <div class="chat-header-presence-dot ${escapeHTML(status)}"></div>
          </div>
          <div class="chat-header-peer-info">
            <span class="chat-header-peer-name">@${escapeHTML(currentPeer)}</span>
            <span class="chat-header-peer-status ${escapeHTML(status)}">${escapeHTML(statusLabels[status] || "offline")}</span>
          </div>
        </a>`;

      peerEl.classList.add("visible");
      if (titleEl) titleEl.style.display = "none";
      if (presenceEl) presenceEl.style.display = "none";
    } else {
      peerEl.classList.remove("visible");
      peerEl.innerHTML = "";
      if (titleEl) titleEl.style.display = "";
      if (presenceEl) presenceEl.style.display = "";
    }
  }

  // ── Discord-style rail ───────────────────────────────────────────────────────

  async function loadRail() {
    const rooms = document.getElementById("chatRailRooms");
    if (!rooms) return;
    const conversations = await apiFetch("/api/chat/conversations") || [];
    const slots = [];

    // Global room
    const globalActive = currentRoom === GLOBAL_ROOM;
    slots.push(`
      <div class="chat-rail-slot${globalActive ? " active" : ""}" data-room="${GLOBAL_ROOM}" title="Global">
        <button type="button" class="chat-rail-btn" data-room="${GLOBAL_ROOM}">#</button>
      </div>`);

    if (conversations.length) {
      slots.push(`<div class="chat-rail-separator"></div>`);
      conversations.slice(0, 12).forEach(conv => {
        const dmRoom = conv.room;
        const peer = conv.with;
        const peerUser = Progress.getUser(peer);
        const active = currentRoom === dmRoom;
        const status = onlineStatuses.get(peer) || "offline";
        const dotHTML = status !== "offline"
          ? `<div class="chat-rail-dot${status === "idle" ? " idle" : ""}"></div>` : "";
        const unreadHTML = (!active && conv.unreadCount) ? `<div class="chat-rail-unread"></div>` : "";
        const avatarInner = peerUser && peerUser.avatar
          ? `<img src="${escapeHTML(peerUser.avatar)}" alt="${escapeHTML(peer)}">`
          : `<span>${escapeHTML(peer.slice(0, 2).toUpperCase())}</span>`;
        slots.push(`
          <div class="chat-rail-slot${active ? " active" : ""}" data-room="${escapeHTML(dmRoom)}" title="@${escapeHTML(peer)}">
            <button type="button" class="chat-rail-btn" data-room="${escapeHTML(dmRoom)}" data-peer="${escapeHTML(peer)}">
              ${avatarInner}${dotHTML}${unreadHTML}
            </button>
          </div>`);
      });
    }

    rooms.innerHTML = slots.join("");
    rooms.querySelectorAll(".chat-rail-slot").forEach(slot => {
      slot.addEventListener("click", () => {
        const room = slot.dataset.room;
        const btn = slot.querySelector(".chat-rail-btn");
        const peer = btn?.dataset.peer || null;
        const label = peer ? `@${peer}` : "Global";
        if (room !== currentRoom) switchRoom(room, label, peer);
        else document.querySelectorAll(".chat-rail-slot").forEach(s => s.classList.toggle("active", s.dataset.room === room));

  // ── Multi-user typing tracker ────────────────────────────────────────────────
  const typingUsers = new Map(); // username → clearTimeout handle

  function renderTypingBar() {
    const el = document.getElementById("chatTyping");
    if (!el) return;
    const names = [...typingUsers.keys()];
    if (!names.length) { el.innerHTML = ""; return; }
    const label = names.length === 1
      ? `@${escapeHTML(names[0])} is typing`
      : names.length === 2
        ? `@${escapeHTML(names[0])} and @${escapeHTML(names[1])} are typing`
        : `${names.length} people are typing`;

  function showTypingHint(username) {
    if (!username || username === currentUser?.username) return;
    // Clear any existing expire timer for this user
    if (typingUsers.has(username)) clearTimeout(typingUsers.get(username));
    const timer = setTimeout(() => { typingUsers.delete(username); renderTypingBar(); }, 3000);
    typingUsers.set(username, timer);
    renderTypingBar();
  }

  function closeSocket() {
    manuallyClosed = true;
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    closeChatChannel();
    socket = null;
  }

  function openChatChannel() {
    if (chatChannel || typeof window === "undefined") return;
    if (window.BroadcastChannel) {
      chatChannel = new BroadcastChannel("progress-chat");
      chatChannel.addEventListener("message", event => {
        handleChatBroadcast(event.data);
      });
    } else {
      window.addEventListener("storage", handleChatStorageEvent);
      chatStorageReceiver = true;
    }
    setStatus("Live", "online");
    broadcastPresence();
  }

  function closeChatChannel() {
    if (chatChannel) {
      try { chatChannel.close(); } catch (e) {}
      chatChannel = null;
    }
    if (chatStorageReceiver) {
      window.removeEventListener("storage", handleChatStorageEvent);
      chatStorageReceiver = false;
    }
  }

  function connectSocket() {
    closeChatChannel();
    openChatChannel();
  }

  function scheduleReconnect() {
    // No backend reconnection needed in frontend-only mode.
  }

  function handleChatStorageEvent(event) {
    if (!event.key || !event.newValue || event.key !== CHAT_BROADCAST_KEY) return;
    try {
      const data = JSON.parse(event.newValue);
      if (data.source === LOCAL_CHAT_INSTANCE) return;
      handleChatBroadcast(data);
    } catch (e) {}
  }

  function handleChatBroadcast(data) {
    if (!data || data.source === LOCAL_CHAT_INSTANCE) return;
    const type = data.type;
    if (type === "message") {
      if (data.message.room === currentRoom) appendMessage(data.message, true);
      if (currentRoom.startsWith("dm:")) loadSidebar();
    } else if (type === "typing") {
      showTypingHint(data.username);
    } else if (type === "presence") {
      if (data.username) {
        onlineStatuses.set(data.username, data.status || "online");
        updatePresenceDots();
        updateChatHeader();
      } else if (data.statuses) {
        applyGlobalPresence(data.statuses);
      }
    } else if (type === "dm-notify") {
      if (data.room !== currentRoom) loadSidebar();
    }
  }

  function broadcastChatEvent(type, payload) {
    const event = { source: LOCAL_CHAT_INSTANCE, type, timestamp: Date.now(), ...payload };
    if (chatChannel) {
      try { chatChannel.postMessage(event); } catch (e) {}
    } else if (typeof window !== "undefined") {
      try { localStorage.setItem(CHAT_BROADCAST_KEY, JSON.stringify(event)); } catch (e) {}
    }
  }

  async function loadHistory() {
    const log = document.getElementById("chatLog");
    log.innerHTML = `<div class="chat-empty">Loading…</div>`;
    seenMessageIds = new Set();
    messageCache.clear();
    lastRenderedDateKey = null;
    lastGroupAuthor = null;
    lastGroupTime = null;
    oldestMessageTime = null;
    hasMoreHistory = true;
    // Refresh pinned bar for this room
    updatePinnedBar(roomMap.get(currentRoom)?.pinnedMsg || null);

    const url = `/api/chat/messages?room=${encodeURIComponent(currentRoom)}&limit=${HISTORY_LIMIT}`;
    const history = await apiFetch(url);
    if (!history) {
      log.innerHTML = `<div class="chat-empty">Couldn't load history — messages sent from here will still go out live.</div>`;
      return;
    }
    if (!history.length) {
      log.innerHTML = `<div class="chat-empty">No messages yet. Say hello.</div>`;
      return;
    }

    if (history.length >= HISTORY_LIMIT) {
      hasMoreHistory = true;
    } else {
      hasMoreHistory = false;
    }

    log.innerHTML = "";
    history.forEach(msg => {
      messageCache.set(msg.id, true);
      appendMessage(msg, false);
    });
    oldestMessageTime = history[0] && history[0].time ? history[0].time : null;
    scrollToBottom(true);
    updateSeenTicks();
  }

  async function loadMoreHistory() {
    if (!hasMoreHistory || loadingMoreHistory) return;
    loadingMoreHistory = true;
    const log = document.getElementById("chatLog");
    if (!log) { loadingMoreHistory = false; return; }
    const before = oldestMessageTime;
    if (!before) { loadingMoreHistory = false; return; }
    const placeholder = document.createElement("div");
    placeholder.className = "chat-empty";
    placeholder.textContent = "Loading older messages…";
    log.prepend(placeholder);
    const currentScroll = log.scrollHeight;
    const url = `/api/chat/messages?room=${encodeURIComponent(currentRoom)}&limit=${HISTORY_LIMIT}&before=${encodeURIComponent(before)}`;
    const history = await apiFetch(url);
    placeholder.remove();
    if (!history || !history.length) {
      hasMoreHistory = false;
      loadingMoreHistory = false;
      return;
    }
    if (history.length < HISTORY_LIMIT) hasMoreHistory = false;
    history.reverse().forEach(msg => {
      if (messageCache.has(msg.id)) return;
      messageCache.set(msg.id, true);
      prependMessage(msg);
    });
    oldestMessageTime = history[0] && history[0].time ? history[0].time : oldestMessageTime;
    log.scrollTop = log.scrollHeight - currentScroll;
    loadingMoreHistory = false;
  }

  function prependMessage(msg) {
    if (seenMessageIds.has(msg.id)) return;
    seenMessageIds.add(msg.id);
    const log = document.getElementById("chatLog");
    if (!log) return;
    const empty = log.querySelector(".chat-empty");
    if (empty && empty.textContent.includes("No messages yet")) empty.remove();
    const dayKey = new Date(msg.time).toDateString();
    const firstMsg = log.querySelector(".chat-msg");
    let separatorNeeded = true;
    if (firstMsg) {
      const firstDate = new Date(firstMsg.dataset.time).toDateString();
      separatorNeeded = firstDate !== dayKey;
    }
    if (separatorNeeded) {
      log.insertAdjacentHTML("afterbegin", `<div class="chat-date-separator"><span>${dateSeparatorLabel(msg.time)}</span></div>`);
    }
    log.insertAdjacentHTML("afterbegin", messageRow(msg, false));
    const msgEl = log.querySelector(`[data-id="${msg.id}"]`);
    if (msgEl) {
      addSwipeToReply(msgEl, msg);
      msgEl.querySelectorAll(".chat-reply-quote").forEach(q => {
        q.addEventListener("click", () => scrollToMessage(q.dataset.targetId));
      });
    }
  }

  function sendMessage(text, imageUrl) {
    const trimmed = (text || "").trim();
    if (!trimmed && !imageUrl && !songPending) return;
    const reply = replyContext;
    clearReplyContext();

    // Build the payload
    const payload = { type: "send", body: trimmed, image: imageUrl || null, replyTo: reply };
    if (songPending) {
      payload.msgType = "song";
      payload.songData = songPending;
      payload.body = `🎵 ${songPending.name} — ${songPending.artists}`;
      songPending = null;
      hideSongSearch();
    }

    apiFetch("/api/chat/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ room: currentRoom, author: currentUser.username, ...payload })
    }).then(msg => {
      if (msg) {
        appendMessage(msg, true);
        broadcastChatEvent("message", { message: msg });
        if (currentRoom.startsWith("dm:")) {
          broadcastChatEvent("dm-notify", { room: currentRoom });
          loadSidebar();
        }
      }
    });
  }

  function sendGameMessage(gameData) {
    const payload = {
      type: "send",
      body: `🎮 ${gameData.prompt}`,
      msgType: "game",
      gameData,
      image: null,
      replyTo: null
    };
    apiFetch("/api/chat/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ room: currentRoom, author: currentUser.username, ...payload })
    }).then(msg => {
      if (msg) {
        appendMessage(msg, true);
        broadcastChatEvent("message", { message: msg });
        if (currentRoom.startsWith("dm:")) {
          broadcastChatEvent("dm-notify", { room: currentRoom });
          loadSidebar();
        }
      }
    });
  }

  // ── Solo: Snake ────────────────────────────────────────────────────────────
  function soloSnake(container) {
    const COLS=20,ROWS=20,CELL=16;
    let snake,food,dir,nextDir,score,loop,running;
    container.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <span style="font-family:var(--font-mono);font-size:12px;color:var(--muted);">Score <strong id="sSnakeScore" style="color:var(--ink);">0</strong></span>
        <button class="cg-btn" id="sSnakeStart">▶ Start</button>
      </div>
      <canvas id="sSnakeCanvas" width="${COLS*CELL}" height="${ROWS*CELL}" style="display:block;margin:0 auto;border-radius:10px;background:var(--mocha-light);max-width:100%;"></canvas>
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:10px;">
        <div><button class="cg-dpad" id="sUp">▲</button></div>
        <div style="display:flex;gap:4px;"><button class="cg-dpad" id="sLeft">◄</button><button class="cg-dpad" id="sDown">▼</button><button class="cg-dpad" id="sRight">►</button></div>
      </div>`;

    const canvas=document.getElementById("sSnakeCanvas"),ctx=canvas.getContext("2d");
    function rnd(){let p;do{p={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));return p;}
    function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};nextDir={x:1,y:0};score=0;food=rnd();document.getElementById("sSnakeScore").textContent=0;}
    function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#e05252";ctx.beginPath();ctx.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,CELL/2-2,0,Math.PI*2);ctx.fill();snake.forEach((s,i)=>{ctx.fillStyle=i===0?`hsl(140,60%,38%)`:`hsl(${140-i*2},55%,48%)`;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2,3);else ctx.rect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2);ctx.fill();});}
    function tick(){dir=nextDir;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.x>=COLS||h.y<0||h.y>=ROWS||snake.some(s=>s.x===h.x&&s.y===h.y)){clearInterval(loop);running=false;showOver();return;}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;document.getElementById("sSnakeScore").textContent=score;food=rnd();}else snake.pop();draw();}
    function showOver(){const d=document.createElement("div");d.style.cssText="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(var(--paper-rgb,250,247,243),0.9);border-radius:16px;z-index:5;";d.innerHTML=`<div style="font-family:var(--font-display);font-size:22px;font-style:italic;">game over</div><div style="font-family:var(--font-mono);font-size:12px;color:var(--muted);">score: ${score}</div><button class="cg-btn" id="sSnakeRetry">play again</button>`;container.style.position="relative";container.appendChild(d);d.querySelector("#sSnakeRetry").addEventListener("click",()=>{d.remove();start();});}
    function start(){reset();draw();clearInterval(loop);running=true;loop=setInterval(tick,120);}
    const kh=e=>{const m={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};const nd=m[e.key];if(!nd)return;if(nd.x!==-dir.x||nd.y!==-dir.y)nextDir=nd;if(e.key.startsWith("Arrow"))e.preventDefault();};
    window.addEventListener("keydown",kh);
    document.getElementById("sSnakeStart").addEventListener("click",()=>{if(!running)start();});
    document.getElementById("sUp").addEventListener("click",()=>{if(dir.y!==1)nextDir={x:0,y:-1};});
    document.getElementById("sDown").addEventListener("click",()=>{if(dir.y!==-1)nextDir={x:0,y:1};});
    document.getElementById("sLeft").addEventListener("click",()=>{if(dir.x!==1)nextDir={x:-1,y:0};});
    document.getElementById("sRight").addEventListener("click",()=>{if(dir.x!==-1)nextDir={x:1,y:0};});
    reset();draw();
    return ()=>{clearInterval(loop);window.removeEventListener("keydown",kh);};
  }

  // ── Solo: Memory ───────────────────────────────────────────────────────────
  function soloMemory(container) {
    const EM=["🌙","🔥","🎸","🌊","🦋","🍓","⚡","🌸"];

  // ── Swipe-to-reply ──────────────────────────────────────────────────────────

  function addSwipeToReply(msgEl, msg) {
    const THRESHOLD = 72;
    let startX = 0, startY = 0, isDragging = false, triggered = false;
    const bubbleCol = msgEl.querySelector(".chat-bubble-col");
    const arrow = msgEl.querySelector(".chat-reply-arrow");

    msgEl.addEventListener("touchstart", e => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      isDragging = false;
      triggered = false;
    }, { passive: true });

    msgEl.addEventListener("touchmove", e => {
      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;
      // Ignore mostly-vertical movement (user is scrolling)
      if (!isDragging && Math.abs(dx) < 8) return;
      if (Math.abs(dy) > Math.abs(dx) * 1.3) return;
      isDragging = true;
      if (dx <= 0) return; // only swipe right
      const capped = Math.min(dx, THRESHOLD + 10);
      if (bubbleCol) {
        bubbleCol.style.transition = "none";
        bubbleCol.style.transform = `translateX(${capped}px)`;
      }
      if (arrow) arrow.style.opacity = String(Math.min(1, capped / THRESHOLD));
      if (capped >= THRESHOLD && !triggered) {
        triggered = true;
        if (arrow) arrow.classList.add("show");
        if (navigator.vibrate) navigator.vibrate(12);
      }
    }, { passive: true });

    msgEl.addEventListener("touchend", () => {
      if (triggered) setReplyContext(msg);
      // Spring the bubble back
      if (bubbleCol) {
        bubbleCol.style.transition = "transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94)";
        bubbleCol.style.transform = "";
      }
      if (arrow) { arrow.style.opacity = ""; arrow.classList.remove("show"); }
      isDragging = false; triggered = false;
    });
  }

  async function stageChatImage(file) {
    const staged = document.getElementById("chatImageStaged");
    if (!staged) return;
    staged.innerHTML = `<div class="chat-image-staged-loading">Uploading&hellip;</div>`;
    const reader = new FileReader();
    reader.onload = async () => {
      const uploaded = await apiFetch("/api/upload-image", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: reader.result })

      if (uploaded && uploaded.url) {

        staged.innerHTML = `

            <img src="${uploaded.url}" alt="">

  function roomListItemHTML(opts) {
    const { room, label, sub, active, avatarUser, unreadCount } = opts;

    const hasUnread = !active && unreadCount > 0;
    const status = peer ? (onlineStatuses.get(peer) || "offline") : null;
    const presenceDot = (status && status !== "offline")
      ? `<div class="chat-room-presence${status === "idle" ? " idle" : ""}"></div>` : "";
    const unreadDot = hasUnread ? `<div class="chat-room-unread-dot"></div>` : "";

      ? `<span class="chat-room-avatar">${avatarHTML(avatarUser, 36)}</span>`
      : `<span class="chat-room-avatar chat-room-avatar-global">#</span>`;

    return `
      <button type="button" class="chat-room-item ${active ? "active" : ""} ${hasUnread ? "has-unread" : ""}"

  async function loadChatRooms() {
    const rooms = await apiFetch(`/api/chat/rooms`);
    if (!Array.isArray(rooms)) return;
    roomMap.clear();
    rooms.forEach(r => roomMap.set(r.room, r));
    renderChatRooms();
    // Refresh community sidebar if visible
    if (document.getElementById("sidebarPanelCommunities")?.classList.contains("active")) {
      renderCommunitySidebar(document.getElementById("communitySidebarSearch")?.value || "");
    }
  }

  function renderChatRooms(filterText = "") {
    const list = document.getElementById("chatRoomsList");
    if (!list) return;
    const filter = String(filterText || "").trim().toLowerCase();
    const rooms = [...roomMap.values()]
      .filter(r => !filter || r.label.toLowerCase().includes(filter) || r.topic.toLowerCase().includes(filter) || r.room.toLowerCase().includes(filter))
      .slice(0, 40);
    if (!rooms.length) {
      list.innerHTML = `<div class="chat-room-empty">No rooms found.</div>`;
      return;
    }
    list.innerHTML = rooms.map(r => `
      <button type="button" class="chat-room-discovery-item" data-room="${escapeHTML(r.room)}">
        <div class="chat-room-discovery-title"># ${escapeHTML(r.label)}</div>
        <div class="chat-room-discovery-sub">${escapeHTML(r.topic || "No topic")}</div>
      </button>
    `).join("");
    list.querySelectorAll(".chat-room-discovery-item").forEach(btn => {
      btn.addEventListener("click", () => {
        const room = btn.dataset.room;
        const roomInfo = roomMap.get(room);
        if (roomInfo) {
          switchRoom(room, `#${roomInfo.label}`, null);
        }
      });
    });
  }

  async function joinRoom(roomId) {
    const r = await apiFetch(`/api/chat/rooms/${encodeURIComponent(roomId)}/join`, { method: "POST" });
    if (r && r.ok) {
      await loadChatRooms();
      renderCommunitySidebar();
      updateCommunityHeader();
    }
    return r;
  }

  async function leaveRoom(roomId) {
    const r = await apiFetch(`/api/chat/rooms/${encodeURIComponent(roomId)}/leave`, { method: "POST" });
    if (r && r.ok) {
      await loadChatRooms();
      renderCommunitySidebar();
      updateCommunityHeader();
    }
    return r;
  }

  // Shows/updates the join-leave bar in the community chat header
  function updateCommunityHeader() {
    const existing = document.getElementById("communityHeaderBar");
    const isCommunity = currentRoom && !currentRoom.startsWith("dm:") && currentRoom !== GLOBAL_ROOM;
    if (!isCommunity) { if (existing) existing.remove(); return; }

    const info = roomMap.get(currentRoom);
    if (!info) { if (existing) existing.remove(); return; }

    const bar = existing || (() => {
      const el = document.createElement("div");
      el.id = "communityHeaderBar";
      el.className = "community-header-bar";
      const head = document.querySelector(".chat-panel-head");
      if (head) head.insertAdjacentElement("afterend", el);
      return el;
    })();

    const count = info.memberCount || 0;
    const joined = info.joined;
    const adminRole = currentUser?.adminRole || "";
    const ROLE_WEIGHTS = { owner: 5, moderator: 4, analyst: 3, email_writer: 2, tester: 1 };
    const isMod = (ROLE_WEIGHTS[adminRole] || 0) >= ROLE_WEIGHTS["moderator"];
    const isCreator = info.createdBy && info.createdBy === currentUser?.username;
    const canManage = isMod || isCreator;

    const ownerName = info.createdBy || null;
    const youAreOwner = ownerName && ownerName === currentUser?.username;
    bar.innerHTML = `
      <span class="community-header-meta">
        <span class="community-header-name"># ${escapeHTML(info.label)}</span>
        ${info.topic ? `<span class="community-header-topic">${escapeHTML(info.topic)}</span>` : ""}
        <span class="community-header-count">
          👥 ${count} member${count !== 1 ? "s" : ""}
          ${ownerName ? `<span style="display:inline-flex;align-items:center;gap:3px;margin-left:8px;font-size:11px;color:var(--muted);">· 👑 <a href="user.html?username=${encodeURIComponent(ownerName)}" style="color:var(--muted);text-decoration:none;font-weight:600;">${youAreOwner ? "you" : "@" + escapeHTML(ownerName)}</a></span>` : ""}
        </span>
      </span>
      <span style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
        ${canManage ? `<button type="button" class="community-header-gear" id="communitySettingsBtn" title="Room settings">⚙️</button>` : ""}
        <button type="button" class="community-header-join-btn ${joined ? "leave" : "join"}" id="communityJoinLeaveBtn">
          ${joined ? "Leave" : "Join community"}
        </button>
      </span>`;

    document.getElementById("communityJoinLeaveBtn")?.addEventListener("click", async (e) => {
      const btn = e.currentTarget;
      btn.disabled = true;
      if (joined) {
        await leaveRoom(currentRoom);
        showToast(`Left #${info.label}`);
      } else {
        await joinRoom(currentRoom);
        showToast(`Joined #${info.label}! 🎉`);
      }
    });

    document.getElementById("communitySettingsBtn")?.addEventListener("click", () => {
      openRoomSettingsPanel(currentRoom, info);
    });
  }

  function resizeImageFile(file, maxW, maxH, quality = 0.85) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = e => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          let { width: w, height: h } = img;
          if (w > maxW || h > maxH) {
            const r = Math.min(maxW / w, maxH / h);
            w = Math.round(w * r); h = Math.round(h * r);
          }
          const c = document.createElement("canvas");
          c.width = w; c.height = h;
          c.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL("image/jpeg", quality));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function openImagePicker(accept, onDataUrl) {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = accept || "image/*";
    inp.style.display = "none";
    document.body.appendChild(inp);
    inp.onchange = async () => {
      const f = inp.files[0]; inp.remove();
      if (!f) return;
      try { onDataUrl(await resizeImageFile(f, 1200, 600, 0.85)); }
      catch { onDataUrl(null); }
    };
    inp.click();
  }

  function openIconPicker(onDataUrl) {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/*";
    inp.style.display = "none";
    document.body.appendChild(inp);
    inp.onchange = async () => {
      const f = inp.files[0]; inp.remove();
      if (!f) return;
      try { onDataUrl(await resizeImageFile(f, 256, 256, 0.9)); }
      catch { onDataUrl(null); }
    };
    inp.click();
  }

  // ── Room Settings Panel ─────────────────────────────────────────────
  function openRoomSettingsPanel(roomId, info) {
    if (document.getElementById("roomSettingsPanelEl")) return;
    const chatPanel = document.querySelector(".chat-panel");
    if (!chatPanel) return;
    chatPanel.style.position = "relative";

    const ACCENT_COLORS = ["#6366f1","#ec4899","#f59e0b","#10b981","#3b82f6","#8b5cf6"];

    // Working state (mutated by pickers before Save)
    let pendingImage = info.image || null;
    let pendingIcon  = info.icon  || null;
    let pendingColor = info.color || ACCENT_COLORS[0];
    let isPrivate    = !!info.isPrivate;

    const panel = document.createElement("div");
    panel.id = "roomSettingsPanelEl";
    panel.className = "room-settings-panel";

    function initials(s) { return (s || "?").slice(0, 2).toUpperCase(); }
    function coverHTML(img) {
      return img
        ? `<img src="${escapeHTML(img)}" alt="cover"><div class="rs-cover-overlay">📷 Change cover</div>`
        : `<div class="rs-cover-empty"><span>🖼️</span>Click to add a cover</div><div class="rs-cover-overlay">📷 Upload cover</div>`;
    }
    function iconHTML(img, color) {
      return img
        ? `<img src="${escapeHTML(img)}" alt="icon"><div class="rs-icon-overlay">✏️</div>`
        : `<div class="rs-icon-initials" style="background:${color || ACCENT_COLORS[0]}">${initials(info.label)}</div><div class="rs-icon-overlay">✏️</div>`;
    }
    function swatchesHTML(selected) {
      return ACCENT_COLORS.map(c =>
        `<button type="button" class="rs-color-swatch${c===selected?" selected":""}" style="background:${c};color:${c};" data-color="${c}" title="${c}"></button>`
      ).join("") +
      `<button type="button" class="rs-color-custom" id="rsColorCustomBtn">Custom…</button>
       <input type="text" class="rs-color-hex" id="rsColorHex" placeholder="#6366f1" value="${selected||""}" maxlength="7">`;
    }

    const youOwn = info.createdBy && info.createdBy === currentUser?.username;

    panel.innerHTML = `
      <div class="room-settings-head">
        <button type="button" class="room-settings-back" id="rsBackBtn" title="Back">←</button>
        <h2 class="room-settings-title">Community Settings</h2>
        ${youOwn ? `<span style="font-size:11px;background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff;border-radius:6px;padding:2px 8px;font-weight:800;">👑 Owner</span>` : ""}
      </div>
      <div class="room-settings-body">
        <!-- Cover banner -->
        <div class="rs-cover" id="rsCover" title="Click to upload a cover image">${coverHTML(pendingImage)}</div>
        <!-- Icon -->
        <div class="rs-icon-row">
          <div class="rs-icon" id="rsIcon" title="Click to upload an icon">${iconHTML(pendingIcon, pendingColor)}</div>
          <span class="rs-icon-hint">Click to change icon</span>
        </div>
        <!-- Name -->
        <div class="rs-section">
          <div class="rs-label">Community Name</div>
          <input class="rs-input" id="rsLabelInput" type="text" value="${escapeHTML(info.label)}" maxlength="50" placeholder="Name your community">
        </div>
        <!-- Description -->
        <div class="rs-section" style="margin-top:12px;">
          <div class="rs-label">Description</div>
          <textarea class="rs-input rs-textarea" id="rsTopicInput" maxlength="200" placeholder="What's this community about?">${escapeHTML(info.topic || "")}</textarea>
        </div>
        <!-- Cover URL fallback -->
        <div class="rs-section" style="margin-top:12px;">
          <div class="rs-label">Cover Image URL <span style="font-weight:400;text-transform:none;font-size:10px;">(or upload above)</span></div>

            <input class="rs-input rs-url-input" id="rsImageUrlInput" type="url" placeholder="https://…" value="${escapeHTML(pendingImage&&pendingImage.startsWith("http")?pendingImage:"")}">

          <div class="rs-label">Accent Color</div>
          <div class="rs-colors" id="rsColors">${swatchesHTML(pendingColor)}</div>
        </div>
        <hr class="rs-section-divider">
        <!-- Privacy -->
        <div class="rs-section">
          <div class="rs-toggle-row">
            <div class="rs-toggle-info">
              <div class="rs-toggle-label">Private community</div>
              <div class="rs-toggle-sub">Only members can see messages</div>
            </div>

        <hr class="rs-section-divider">

        ${youOwn ? `
        <div class="rs-section">

            <span class="rs-invite-link" id="rsInviteLink" style="color:var(--muted);font-style:italic;">Click Generate to create a link</span>
            <button type="button" class="rs-invite-gen" id="rsInviteGenBtn">Generate</button>

        <div class="rs-section">
          <div class="rs-label">Members</div>

        </div>

    chatPanel.appendChild(panel);
    requestAnimationFrame(() => panel.classList.add("open"));

    panel.querySelector("#rsCover").addEventListener("click", () => {
      openImagePicker("image/*", dataUrl => {
        if (!dataUrl) return;
        pendingImage = dataUrl;
        panel.querySelector("#rsCover").innerHTML = coverHTML(pendingImage);
        panel.querySelector("#rsImageUrlInput").value = "";
      });
    });
    panel.querySelector("#rsImageUrlInput").addEventListener("input", e => {

    });
    panel.querySelector("#rsCoverClearBtn").addEventListener("click", () => {
      pendingImage = null;
      panel.querySelector("#rsCover").innerHTML = coverHTML(null);
      panel.querySelector("#rsImageUrlInput").value = "";
    });

    // Icon upload
    panel.querySelector("#rsIcon").addEventListener("click", () => {
      openIconPicker(dataUrl => {
        if (!dataUrl) return;
        pendingIcon = dataUrl;
        panel.querySelector("#rsIcon").innerHTML = iconHTML(pendingIcon, pendingColor);
      });
    });

    // Color swatches
    function updateSwatches() {
      panel.querySelectorAll(".rs-color-swatch").forEach(s => {
        s.classList.toggle("selected", s.dataset.color === pendingColor);
      });
      panel.querySelector("#rsColorHex").value = pendingColor;
      // Reflect on icon if no custom icon
      if (!pendingIcon) panel.querySelector("#rsIcon").innerHTML = iconHTML(null, pendingColor);
    }
    panel.querySelector("#rsColors").addEventListener("click", e => {
      const sw = e.target.closest(".rs-color-swatch");
      if (!sw) return;
      pendingColor = sw.dataset.color;
      updateSwatches();
    });
    panel.querySelector("#rsColorHex").addEventListener("input", e => {
      const v = e.target.value.trim();
      if (/^#[0-9a-fA-F]{6}$/.test(v)) { pendingColor = v; updateSwatches(); }
    });
    panel.querySelector("#rsColorCustomBtn").addEventListener("click", () => {
      const inp = document.createElement("input");
      inp.type = "color"; inp.value = pendingColor || "#6366f1"; inp.style.display = "none";
      document.body.appendChild(inp);
      inp.oninput = () => { pendingColor = inp.value; updateSwatches(); };
      inp.onchange = () => inp.remove();

    panel.querySelector("#rsPrivateToggle").addEventListener("click", () => {

      btn.setAttribute("aria-checked", String(isPrivate));
    });

    panel.querySelector("#rsBackBtn").addEventListener("click", closePanel);

    // Save
    panel.querySelector("#rsSaveBtn").addEventListener("click", async () => {
      const saveBtn = panel.querySelector("#rsSaveBtn");
      const status  = panel.querySelector("#rsStatus");
      const label   = panel.querySelector("#rsLabelInput").value.trim();
      const topic   = panel.querySelector("#rsTopicInput").value.trim();
      if (!label) { status.textContent = "Name can't be empty."; status.style.color = "var(--danger,#e05050)"; return; }
      saveBtn.disabled = true; status.textContent = "Saving…"; status.style.color = "var(--muted)";
      const body = { label, topic, color: pendingColor, isPrivate,
                     image: pendingImage !== undefined ? pendingImage : null,
                     icon:  pendingIcon  !== undefined ? pendingIcon  : null };
      const res = await apiFetch(`/api/chat/rooms/${encodeURIComponent(roomId)}`, {
        method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
      });
      saveBtn.disabled = false;
      if (res && res.ok) {
        status.textContent = "✓ Saved!"; status.style.color = "#22c55e";
        await loadChatRooms();
        renderCommunitySidebar();
        updateCommunityHeader();
        if (typeof renderExploreGrid === "function") renderExploreGrid("");
        setTimeout(() => { if (status) status.textContent = ""; }, 2500);
      } else {
        status.textContent = res?.error || "Could not save."; status.style.color = "var(--danger,#e05050)";
      }
    });

    // Delete
    panel.querySelector("#rsDeleteBtn").addEventListener("click", async () => {
      const deleteBtn = panel.querySelector("#rsDeleteBtn");
      const status    = panel.querySelector("#rsStatus");
      if (!deleteBtn.dataset.confirmed) {
        deleteBtn.textContent = "⚠️ Tap again to permanently delete";
        deleteBtn.style.background = "#e05050"; deleteBtn.style.color = "#fff";
        deleteBtn.dataset.confirmed = "1";
        setTimeout(() => {
          if (!deleteBtn) return;
          deleteBtn.textContent = "🗑 Delete this community";
          deleteBtn.style.background = ""; deleteBtn.style.color = "";
          delete deleteBtn.dataset.confirmed;
        }, 5000);
        return;
      }
      deleteBtn.disabled = true;
      status.textContent = "Deleting…"; status.style.color = "var(--muted)";
      const res = await apiFetch(`/api/chat/rooms/${encodeURIComponent(roomId)}`, { method: "DELETE" });

        showToast("Community deleted.");

        if (currentRoom === roomId) await switchRoom(GLOBAL_ROOM);
